<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#262b16">
<title>Anara Villa Type A Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Anara tokens — liquid-glass chrome over a full-bleed panorama.
   Layout: logo + breadcrumb top-start · floor switcher top-centre · language top-end · tool rail on the end edge ·
   room card bottom-start · room dock bottom-centre · minimap + actions bottom-end. */
:root{
  --olive-950:#262b16; --olive-900:#3f4727; --olive-700:#5f654a; --olive-500:#80856e; --olive-200:#c6c8bd; --olive-50:#eaebe7;
  --gold-600:#9b9265; --gold-500:#b0a57a; --gold-300:#d3ccb3; --gold-200:#e4dfd0; --gold-50:#f5f4ee;
  --night-900:#12150a;
  --ink:#1d2110; --ink-muted:#1d2110b3; --ink-light:#f3f1e7;
  --tint:#ffffff85; --tint-strong:#ffffffc2; --tint-dark:#14180a8f; --rim:#ffffff80; --radius:.75rem;
  --primary:var(--olive-900); --primary-fg:var(--gold-50);
  --ease-swell:cubic-bezier(.34,1.56,.64,1); --ease-soft:cubic-bezier(.22,1,.36,1);
  --f:"IBM Plex Sans Arabic",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --top:calc(env(safe-area-inset-top,0px) + 16px); --bot:calc(env(safe-area-inset-bottom,0px) + 16px);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--night-900);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--olive-900);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}#stage.go{cursor:pointer}
body.measuring #stage{cursor:crosshair}
#stage canvas{display:block;width:100%;height:100%}
/* soft vignette so glass chrome always reads */
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(#0f120859,#0f120800 18%),linear-gradient(0deg,#0f120866,#0f120800 26%)}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;color:var(--ink);border-radius:999px;box-shadow:0 12px 32px -10px rgba(18,21,10,.42),0 2px 6px rgba(18,21,10,.14)}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;transition:inset .7s var(--ease-swell)}
.glass::before{backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.glass::after{background:var(--tint);box-shadow:inset 2px 2px 1px #ffffff80,inset -1px -1px 1px 1px #ffffff80}
.glass.ink-light{color:var(--ink-light)}.glass.ink-light::after{background:var(--tint-dark)}
.glass.card{border-radius:calc(var(--radius) * 1.5)}.glass.card::after{background:var(--tint-strong)}
.glass.hov:hover::before,.glass.hov:hover::after{inset:-3px}
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.chip:hover{background:#ffffff4d;box-shadow:inset 0 1px 0 #ffffffb3}
.chip[aria-pressed="true"],.chip[aria-current="true"],.chip[aria-selected="true"]{background:var(--olive-900);color:var(--gold-50);box-shadow:inset 0 1px 0 #ffffff26,0 6px 16px -6px #1e220e99}
.ibtn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s;position:relative}
.ibtn:hover{background:#ffffff26}
.ibtn svg{transition:scale .6s var(--ease-swell)}.ibtn:hover svg{scale:1.1}
.ibtn[aria-pressed="true"]{background:var(--olive-500);color:#fff;box-shadow:inset 0 1px 0 #ffffff40}
#big .ibtn:hover,#mini .ibtn:hover{background:#ffffff66}
.ibtn[data-tip]::after{content:attr(data-tip);position:absolute;inset-inline-end:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(4px);white-space:nowrap;
  padding:6px 11px;border-radius:999px;background:var(--olive-950);color:var(--gold-50);font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s,transform .25s var(--ease-soft)}
[dir="rtl"] .ibtn[data-tip]::after{transform:translateY(-50%) translateX(-4px)}
.ibtn[data-tip]:hover::after,.ibtn[data-tip]:focus-visible::after{opacity:1;transform:translateY(-50%)}
@media (hover:none){.ibtn[data-tip]::after{display:none}}
.primary{height:44px;padding:0 20px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:9px;
  box-shadow:0 10px 28px -10px #1e220e8c;flex:0 0 auto;transition:transform .4s var(--ease-swell),background .2s}
.primary:hover{transform:translateY(-1px);background:var(--olive-950)}
.secondary{height:44px;padding:0 18px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:9px;flex:0 0 auto}
.chrome{transition:opacity .6s var(--ease-soft),transform .6s var(--ease-soft)}
body.presenting .chrome{opacity:0;pointer-events:none}
body:has(#intro:not([hidden]):not(.out)) :is(.chrome,.chrome-keep,#tags,.stairs,#arrows){opacity:0!important;pointer-events:none!important}
.chrome-keep{transition:opacity .6s var(--ease-soft)}
body.doll .pano-only{opacity:0;pointer-events:none}

/* ---------- top ---------- */
.tl{position:fixed;inset-inline-start:var(--gl);top:var(--top);z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.logo{width:108px;height:auto;display:block;--logo-star:#fff;--logo-word:#fff;filter:drop-shadow(0 1px 10px rgba(0,0,0,.35))}
.homebtn{display:block;border-radius:12px}
.crumb{display:flex;align-items:center;gap:7px;padding:7px 15px;font-size:12.5px;font-weight:500}
.crumb span{color:var(--ink-muted);font-weight:400}
.crumb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;opacity:.5}
[dir="rtl"] .crumb svg{transform:scaleX(-1)}
.floors{position:fixed;top:var(--top);left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:4px}
.row2{display:flex;gap:8px;align-items:center}
.lang{display:flex;gap:2px;padding:4px;height:44px;align-items:center}
.lang .chip{height:32px;padding:0 12px;font-size:12.5px}

/* ---------- tool rail ---------- */
.tools{position:fixed;inset-inline-end:var(--gr);top:calc(var(--top) + 44px);z-index:6;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:28px}
.tools hr{border:0;height:1px;background:#f3f1e72e;margin:4px 10px}

/* ---------- room card ---------- */
.room{transition:opacity .6s var(--ease-soft);position:fixed;inset-inline-start:var(--gl);bottom:var(--bot);z-index:6;width:min(310px,calc(100vw - 32px));padding:16px 18px 14px}
.room .eyebrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-muted);font-weight:500}
[dir="rtl"] .room .eyebrow{letter-spacing:0}
.room .eyebrow .code{padding:1px 9px;border-radius:999px;background:var(--olive-900);color:var(--gold-50);font-variant-numeric:tabular-nums}
.room h1{margin:6px 0 0;font-size:clamp(24px,2.6vw,30px);font-weight:500;line-height:1.15;color:var(--ink);text-wrap:balance}
.room .ar2{font-size:14px;color:var(--ink-muted);margin-top:2px}
.room .meta{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid #1d21101a}
.room .meta div{display:flex;flex-direction:column;gap:1px}
.room .meta b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.room .meta span{font-size:11.5px;color:var(--ink-muted)}
.room .fin{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.room .fin li{font-size:12px;padding:4px 10px;border-radius:999px;background:#ffffff99;box-shadow:inset 0 0 0 1px #1d211014}
.room .note{font-size:11px;color:var(--ink-muted);margin-top:10px}
.room.collapsed .meta,.room.collapsed .fin,.room.collapsed .note{display:none}
.room .swap{animation:swapin .6s var(--ease-soft)}
@keyframes swapin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 54px);z-index:6;max-width:min(calc(100vw - 340px),860px)}
.rooms .chip{height:30px;font-size:13px;padding:0 12px}
.rooms{display:flex;gap:2px;padding:5px;overflow-x:auto;scrollbar-width:none;border-radius:999px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);scroll-padding-inline:24px}
.rooms::-webkit-scrollbar{display:none}
.rooms .gsep{flex:none;width:1px;align-self:stretch;margin:7px 5px;background:#1d211026}
.actions{position:fixed;inset-inline-end:var(--gr);bottom:var(--bot);z-index:6;display:flex;gap:8px;align-items:center}

/* ---------- minimap ---------- */
#mini{position:fixed;inset-inline-end:var(--gr);bottom:calc(var(--bot) + 62px);z-index:5;width:220px;padding:9px}
@media (max-height:640px){.room .note{display:none}.room h1{font-size:22px}.room .meta{margin-top:8px;padding-top:8px}.room{padding:12px 16px 12px}}
@media (max-height:820px) and (min-width:861px){#mini:not(.mid){width:180px}#mini header{font-size:11.5px}}
#mini header{display:flex;justify-content:space-between;align-items:center;padding:2px 5px 7px;font-size:12px;font-weight:600}
#mini header button{font-size:12px;font-weight:500;color:var(--ink-muted);display:flex;align-items:center;gap:4px}
#mini header svg{width:13px;height:13px}
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--gold-200);line-height:0;cursor:pointer}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.map .pins{position:absolute;inset:0}
.pin{-webkit-appearance:none;appearance:none;scale:calc(1 / var(--z,1));position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--olive-900);border:0;padding:0;box-shadow:0 0 0 1.5px #fff,0 1px 3px #1e220e99;z-index:2;transition:scale .3s var(--ease-swell),background .2s}
.pin::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.pin:hover{scale:calc(1.35 / var(--z,1));background:var(--olive-500)}
.pin[aria-current="true"]{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--olive-900);box-shadow:0 0 0 2.5px #fff,0 0 0 4px #3f472740,0 2px 6px #1e220e80;z-index:3}
.pin[aria-current="true"]::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--gold-300)}
.pin[aria-current="true"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid #3f4727aa;animation:pinPulse 2.2s ease-out infinite;pointer-events:none}
@keyframes pinPulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.cone{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;filter:drop-shadow(0 0 .6px #fff) drop-shadow(0 1px 2px #0006);pointer-events:none;z-index:1;overflow:visible;scale:calc(1 / var(--z,1));transition:opacity .3s}
#mini.mid .cone{width:58px;height:58px;margin:-29px 0 0 -29px}
#big .cone{width:70px;height:70px;margin:-35px 0 0 -35px}
.cone .cw{fill:url(#cg)}.cone .ce{display:none}
.plbl{scale:calc(1 / var(--z,1));transform-origin:0 0;position:absolute;transform:translate(-50%,12px);font-size:11.5px;font-weight:500;line-height:1.2;white-space:nowrap;padding:3px 8px;border-radius:999px;background:#ffffffe0;color:var(--ink);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);text-align:center}
.plbl small{display:block;font-size:10.5px;color:var(--olive-700);font-variant-numeric:tabular-nums}
#mini .plbl{display:none}
#mini{transition:width .45s var(--ease-soft)}
#mini.mid{width:min(440px,36vw)}
#mini.mid .plbl{font-size:10.5px;padding:2px 8px;transform:translate(-50%,10px);z-index:4}#mini.mid .pin:hover+.plbl{display:block}#mini.mid .plbl small{display:none}
#mini.mid .pin{width:10px;height:10px;margin:-5px 0 0 -5px}
#mini .sz{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:#ffffff73;box-shadow:inset 0 0 0 1px #3f47271a}
#mini .sz button{width:28px;height:24px;font-size:11.5px;font-weight:600;border-radius:999px;display:grid;place-items:center;color:var(--olive-700);gap:0}
#mini .sz button:hover{background:#ffffffb3}
#mini .sz button[aria-pressed="true"]{background:var(--olive-900);color:var(--gold-50)}
#mini .sz svg{width:17px;height:14px}
#mini.mid{width:min(400px,30vw,calc((100vh - 300px) * .9))}

/* ---------- enlarged plan ---------- */
#big{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#12150a8c;
  padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gl)}
#big .sheet{width:min(100%,1040px);height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}
#big .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#big .grp{display:flex;gap:2px;padding:3px;border-radius:999px;background:#ffffff59}
#big .viewport{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--gold-200);border-radius:14px;min-height:0;flex:1 1 0}
#big .viewport.drag{cursor:grabbing}
#big .map{margin:0;position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;border-radius:0;background:none}
#big .pin{width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:0 0 0 2.5px #f5f4eef2,0 2px 6px #1e220e80}
#big .pin[aria-current="true"]{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;box-shadow:0 0 0 3px var(--olive-900),0 0 0 5.5px #f5f4eee6,0 2px 8px #1e220e80}
#big .foot{font-size:12.5px;color:var(--ink-muted)}

/* ---------- pano overlays ---------- */
#hov::after{background:#3f4727e0}#hov{color:var(--gold-50)!important;position:fixed;left:0;top:0;z-index:4;padding:6px 13px;font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#hov.on{opacity:1}
#arrows{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.stairbtn{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .3s}
.stairbtn.on{opacity:1;pointer-events:auto}
.stairbtn .arr{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite;transition:scale .4s var(--ease-swell)}
.stairbtn .arr::after{background:#ffffffc4}
.stairbtn .arr svg{width:26px;height:26px;stroke:var(--olive-900);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stairbtn .lbl{position:absolute;left:0;top:36px;transform:translateX(-50%);white-space:nowrap;padding:5px 12px;font-size:12.5px;font-weight:500}
.stairbtn:hover .arr{scale:1.12}.stairbtn:hover .arr::after{background:var(--olive-900)}.stairbtn:hover .arr svg{stroke:var(--gold-50)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
#mlayer{position:fixed;inset:0;pointer-events:none;z-index:3}
#mlayer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mlbl{position:absolute;transform:translate(-50%,-50%);padding:5px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 104px);z-index:7;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;font-size:13px}
[dir="rtl"] .pill-bar{padding:6px 16px 6px 6px}
.pill-bar .chip{height:30px}

/* ---------- guided tour ---------- */
#tourbar .dots{display:flex;gap:4px}
body.touring #cap{z-index:30}
#tourbar .dots i{cursor:pointer;width:6px;height:6px;border-radius:50%;background:#1d211033;transition:background .3s,width .3s}
#tourbar .dots i.on{width:18px;border-radius:3px;background:var(--olive-900)}
#tourbar .dots i.done{background:var(--olive-500)}
body.presenting #tourbar{opacity:.25;transition:opacity .4s}
body.presenting #tourbar:hover{opacity:1}

#chap{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:8;padding:18px 30px 20px;text-align:center;display:flex;flex-direction:column;gap:4px;animation:capin .8s var(--ease-soft);transition:opacity .6s}
#chap.out{opacity:0}
#chap span{font-size:13px;color:var(--ink-muted);font-weight:500}
#chap b{font-size:30px;font-weight:500;line-height:1.2}
#summary{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;width:min(480px,calc(100vw - 32px));padding:26px 28px 24px}
#summary h2{margin:0 0 12px;font-size:24px;font-weight:500}
#summary ul{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
#summary li{font-size:14.5px;line-height:1.45;padding-inline-start:22px;position:relative}
#summary li::before{content:"";position:absolute;inset-inline-start:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--olive-900)}
#summary .row{display:flex;gap:8px;flex-wrap:wrap}
#summary .sumlead{margin:0 0 14px;font-size:14px;color:var(--ink-muted);line-height:1.5}
body.touring .actions,body.touring .room{opacity:0;pointer-events:none}
body.touring #mini{opacity:1;pointer-events:none}body.touring #mini header .sz,body.touring #mini #miniOpen{visibility:hidden}
body.touring:has(#factsPop:not([hidden])) #mini,body.touring:has(#regPop:not([hidden])) #mini{opacity:0}
#mini.glimpse{box-shadow:0 0 0 2px var(--gold-300),0 24px 60px -18px #000a}
#cap{position:fixed;inset-inline-start:var(--gl);bottom:var(--bot);z-index:12;width:min(600px,calc(100vw - 32px));padding:20px 24px 18px;border-radius:24px;color:var(--gold-50)}
#cap::after{background:linear-gradient(160deg,#12150ad1,#262b16c7)!important;box-shadow:inset 0 1px 0 #f5f4ee2e,inset 0 0 0 1px #f5f4ee14!important}
#cap .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;font-weight:500;color:var(--gold-300);margin-bottom:10px}
#cap .meta .step{font-variant-numeric:tabular-nums;color:#f5f4ee99}
#cap .head{display:block;font-size:clamp(22px,2.4vw,30px);font-weight:400;line-height:1.25;color:#fff;margin-bottom:6px;text-wrap:balance}
#cap p{margin:0;font-size:16px;line-height:1.65;color:#f5f4eed1;text-wrap:pretty;max-width:52ch}
#cap .prog{margin-top:16px;height:2px;border-radius:2px;background:#f5f4ee24;overflow:hidden}
#cap .prog i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--olive-200),var(--gold-300))}
[dir="rtl"] #cap .prog i{transform-origin:right center}
#cap .prog i.run{animation:capfill var(--d,5s) linear forwards}
body.tourpaused #cap .prog i.run{animation-play-state:paused}
@keyframes capfill{to{transform:scaleX(1)}}
#cap.in .head{animation:capin .7s var(--ease-soft) both}
#cap.in p{animation:capin .7s .12s var(--ease-soft) both}
@keyframes capin{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
body.presenting .room{opacity:0;pointer-events:none}
@media (max-width:860px){#cap{bottom:calc(var(--bot) + 8px);padding:16px 18px 14px}#cap p{font-size:14.5px}}
/* ---------- popovers ---------- */
.pop{position:fixed;z-index:25;width:min(320px,calc(100vw - 32px));padding:16px;display:flex;flex-direction:column;gap:10px}
.pop h3{margin:0;font-size:15px;font-weight:600}
.pop p{margin:0;font-size:12.5px;color:var(--ink-muted);line-height:1.5}
.pop .row{display:flex;gap:8px;flex-wrap:wrap}
.pop{user-select:text;-webkit-user-select:text}
.pop .link{font:12px/1.4 ui-monospace,Menlo,monospace;background:#ffffffb3;border-radius:10px;padding:8px 10px;word-break:break-all;user-select:all}
#tags{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.ftag{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .35s}
.ftag.on{opacity:1;pointer-events:auto}

[dir="rtl"] .bar2 .tr i{transform-origin:right;background:linear-gradient(270deg,var(--olive-500),var(--olive-900))}

.split{display:flex;gap:3px;height:14px;margin-top:16px;border-radius:99px;overflow:hidden}.split i{display:block;height:100%}

/* ---------- dollhouse ---------- */
#doll{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at 50% 40%,var(--gold-50),var(--gold-200) 70%,#cfc7ad);opacity:0;pointer-events:none;transition:opacity .6s var(--ease-soft)}
#doll.on{opacity:1;pointer-events:auto}
#doll.cine .dhead,#doll.cine .dback,#doll.cine .dhint,#doll.cine .dpins{display:none}
#doll.cine{pointer-events:none}
#doll.cine~#chap,#chap{z-index:12}
#tourbar{z-index:13}
#doll canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#doll canvas.drag{cursor:grabbing}
#doll .dpins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dpin{position:absolute;left:0;top:0;pointer-events:auto;width:0;height:0}
.dpin i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--olive-900);box-shadow:0 2px 8px rgba(0,0,0,.35);transition:scale .3s var(--ease-swell)}
.dpin.cur i{background:var(--olive-900);border-color:#fff}
.dpin b{position:absolute;left:0;bottom:12px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:#ffffffe6;box-shadow:0 4px 12px rgba(0,0,0,.18);opacity:0;transition:opacity .15s;pointer-events:none}
.dpin:hover i{scale:1.3}.dpin:hover b,.dpin.cur b{opacity:1}
.dpin.dim{opacity:.0;pointer-events:none}
#doll .dhead{position:absolute;top:var(--top);left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px}
#doll .dback{position:absolute;inset-inline-end:var(--gr);top:var(--top)}
#doll .dhint{position:absolute;left:50%;bottom:var(--bot);transform:translateX(-50%);padding:8px 16px;font-size:13px}

const BANK={"en":{"tour_0":"Welcome, and thank you for coming. This is Villa Type A. Three floors, about three hundred and eighty-nine square metres, with parking for two cars. Come in, let me show you around.","tour_1":"Five bedrooms, a men's majlis, a home office, two separate entrances, and rooms for the driver and the maid. Everything a family needs.","tour_2":"Before we go in, right here by the gate, the driver's room, with its own bathroom, completely separate from the house.","tour_3":"Now, back to the main door. After you.","tour_4":"This is the main entrance. Look up: it's double height, two floors tall, and it feels grand from the very first step.","tour_5":"On your left as you come in, the men's majlis. Your guests come straight in here, and never cross the family side.","tour_6":"And if you look outside, its own private garden. A lovely place to sit, isn't it?","tour_7":"Right next to the majlis, guests have their own wash area and toilet.","tour_8":"Back at the entrance, look to your right: a home office. Work, or receive a visitor, without opening up the house.","tour_9":"Straight ahead, the dining room. It sits between the majlis and the family living room, so serving guests is easy.","tour_10":"Come with me. On your right, the family's own entrance, behind this screen. They come and go in complete privacy.","tour_11":"And ahead of you, the family living room. Open, bright, and the heart of the home.","tour_12":"On the other side, the stair. It wraps around a planted courtyard, and brings daylight right into the centre of the house.","tour_13":"Next, the kitchen. It's closed, with worktops all round, built-in ovens, and a window over the sink.","tour_14":"Behind the kitchen, the maid's room, with its own bathroom and the laundry. The driver's room, as we saw, is by the gate.","tour_15":"Now, let's go upstairs. This floor is just for the family. Four master bedrooms, each with its own bathroom.","tour_16":"As you come up, the family lounge. To its right, a coffee corner, and then a terrace for fresh air.","tour_17":"We start with the main suite. Calm and generous, with a tall window.","tour_18":"Through here, its dressing room, and on the left, a private bathroom.","tour_19":"Next door, the second bedroom, with built-in wardrobes and its own bathroom.","tour_20":"Follow me along this corridor. If you look down, you see the entrance through this glass opening. It shares its light with the bedroom wing.","tour_21":"Look to your right: the third bedroom. The screened window lets the light in and keeps your privacy.","tour_22":"And to your left, the fourth, with a glass wardrobe and a wide window.","tour_23":"And finally, one more flight up. A private suite, away from everything.","tour_24":"A full bedroom, with a bathroom and a pantry beside it. For guests, or one of your grown-up children. It's up to you.","tour_25":"And if you look outside, the roof terrace. Imagine your evenings out here.","tour_26":"If you like what you've seen, register your interest, and we'll arrange a private visit at your convenience. Thank you.","greet":"Hello, and welcome! This is Villa Type A. How can I help you today? What would you like to know about the villa?","greet_salam":"Wa alaikum assalam, and welcome! How can I help you today?","greet_morning":"Good morning, and welcome! How can I help you today?","greet_evening":"Good evening, and welcome! How can I help you today?","hey":"Hello!","howru":"I'm doing great, thank you for asking. And how are you?","greet_howru":"Hello! I'm doing great, thank you for asking. And how are you?","fine":"Glad to hear it. Shall I show you around? I can start the guided tour, or take you straight to any room you like.","okay":"Great. Where would you like to go next? The majlis, the kitchen, or the bedrooms upstairs?","who":"I'm your guide to Villa Type A at Anara. I know every corner of this home, so ask me anything, in Arabic or English.","wow":"Thank you, it suits you! May it be a blessed home. And to complete the picture, let me show you the main entrance. It's double height, two floors tall. Shall we?","thanks":"You're most welcome. Anything else you'd like to see?","bye":"Thank you for visiting, it was a pleasure showing you around. If you'd like to see it in person, I can book you a private visit.","help":"Ask me anything a buyer would: room sizes, bedrooms, floors, parking, privacy, the location, price or handover. Or just say, take me to the majlis.","unknown":"Honestly, I don't have that exact detail with me. But I can have someone from the Anara team get in touch, if you leave your number, your email and a good time to call. They'll look after you properly and get you every detail you need. Shall I open the form?","noProb":"No problem at all. What would you like to do next?","come":"Sure, come with me.","come2":"Opening the Anara platform for you.","yesroom":"Yes, there is. Come with me, let me show you.","opinion":"Honestly? It's a very well thought-out family home. Guests have their own side and their own majlis, the family has its own entrance and privacy, and every bedroom has its own bathroom. Look around you, you can feel the light and the space. Shall I show you my favourite spot in the house?","worth":"That's your call, of course. What sets it apart is the privacy between guests and family, a bathroom for every bedroom, and a whole floor just for the family. The sales team can give you the full numbers, so you can compare in peace. Shall I have them call you?","neg":"I understand. Pictures don't always give the real feel of a space. If you like generous rooms, the majlis and the family living room are the largest. Shall I take you there?","off":"Ha, good one! But I'm only an expert on this house. Let me help you with that instead: shall we go to the majlis, or up to the bedrooms?","off2":"Honestly, no idea! This house is all I know. Want me to show you my favourite corner of it?","off3":"Ha, that one's above my pay grade! Rooms and sizes, that's my thing. Come, let me show you the majlis.","off4":"I really can't answer a question like that! Ask me anything about the house, though.","off5":"Football? If I pick a side, you might fall out with me! Let's stick to the house, it's safer. Shall we see the living room?","disc":"I wish I could! Prices and offers are with the sales team, and I'll pass your request on. Shall I have them call you?","sorry":"Sorry if I didn't get you right. Try asking me another way, or tell me what you'd like to see.","next":"Come with me, let me show you what's next.","sure":"Yes, I'm sure. These figures come from Anara's approved plans.","lives":"Nobody yet. It's waiting for its family, and maybe that's you.","brief":"With pleasure. Villa Type A is three floors, about three hundred and eighty-nine square metres. Five bedrooms, each with its own bathroom, nine bathrooms in all. The ground floor is for hosting and family life: a men's majlis with its own garden, an office by the entrance, a dining room, a family living room by a planted courtyard, and a closed kitchen. The first floor is just for the family, with four master bedrooms, a lounge and a terrace. And up top, a guest suite opening onto the roof. My favourite part? A guest never crosses the family side. Shall we start with the majlis?","near":"Good question. The project is in Riyadh, about twenty-five minutes from King Khalid International Airport, and the Anara platform's map shows the schools, mosques and services around it. Shall I open it for you?","measureGo":"Done, the tape is ready. Tap the start point on the floor, then the end point of whatever you'd like to measure. For a height, tap the floor, then straight up.","nosize":"This space doesn't have a set size on the plan, but you can measure it yourself with the tape. Shall I open it for you?","height":"The ceiling height isn't written on the plan, but you can measure it yourself: tap the floor by the wall, then straight up at the ceiling. Shall I open the tape for you?","beds":"Five bedrooms. Four master bedrooms on the first floor, each with its own bathroom, and a private guest suite on the second floor.","baths":"Nine bathrooms in all. Every bedroom has its own, guests have a separate wash area and toilet, and the maid and the driver each have their own.","floors":"Three floors. The ground floor for hosting and family life, the first floor just for the family with four master bedrooms, and the second floor a guest suite with the roof terrace.","area":"About three hundred and eighty-nine square metres: around a hundred and ninety on the ground floor, a hundred and fifty-two on the first, and forty-seven on the second.","fl0":"The ground floor has the arrival court, the men's majlis with its garden, the office, the dining room, the family living room by a planted courtyard, the closed kitchen and laundry, and the maid's and driver's rooms.","fl1":"The first floor is just for the family: four master bedrooms, each with its own bathroom, a dressing room, the family lounge with a coffee corner, a pantry and a terrace.","fl2":"The second floor is a private guest suite, with its own bathroom and pantry, opening onto the roof terrace.","largest":"The largest room is the men's majlis, about twenty square metres. Come, let me show you.","smallest":"The smallest room is the family wash area, under two square metres.","price":"Prices and payment plans come straight from the Anara sales team, so they're always up to date. Shall I have them call you with the latest offers?","avail":"Live availability for every villa is on the Anara platform's masterplan, where you can see what's available, reserved and sold.","handover":"Handover dates and construction progress are confirmed by the Anara sales team. Leave your details and they'll keep you updated.","visit":"With pleasure. Leave your name and number, and the Anara team will arrange your private visit.","loc":"Anara by Sumou is in Riyadh, about twenty-five minutes' drive from King Khalid International Airport. The Anara platform shows the full location and journey times.","dev":"Anara is developed by Sumou.","hl":"What makes it special: separate main and family entrances, a double-height entrance, a home office by the door, a kitchen with its own service side, a bathroom for every bedroom, and a guest suite with a roof terrace.","park":"Parking for two cars, in the arrival court right in front of the villa.","privacy":"Privacy is the heart of the design. Guests come through the main entrance into the majlis without passing the family side, the family has its own entrance, and the whole first floor is theirs.","outdoor":"Three outdoor spaces: the planted courtyard at the heart of the ground floor, the family lounge terrace upstairs, and the roof terrace beside the guest suite.","pool":"A pool isn't part of the villa plans. The outdoor spaces are the planted courtyard, the first-floor terrace and the roof terrace.","lift":"The plans don't include a lift. The stair wraps around the planted courtyard and links all three floors. The sales team can tell you about any options.","staff":"Yes. The maid's room, with its bathroom and the laundry, is behind the kitchen, and the driver's room, with its own bathroom, is by the gate, completely separate from the house.","family":"It's ideal for a big family: five bedrooms, each with its own bathroom, a whole floor just for the family, two living areas, and separate rooms for the maid and the driver.","spec":"Finishes, air conditioning, smart-home features and warranties are all in the Anara specification sheet. Shall I have the sales team send it to you?","furn":"The furniture in the tour shows how you could live in the home. The sales team will confirm exactly what's included.","custom":"Any changes to the design or finishes are discussed with the Anara sales team. Shall I have them call you?","other":"Anara has three villa types: this Type A, Type D, and the Type C duplex. Each one has its own tour on the Anara platform.","tour":"With pleasure, come with me, let's start the tour.","plan":"Here's the floor plan. Tap any room and I'll take you there.","facts":"Here are the villa's key facts.","share":"Here's a link to this exact view, to share with whoever you like.","music":"Done.","go":"Come with me.","room_gf-porch":"This is the arrival court, on the ground floor. Two cars park here comfortably, and the main door is right in front of you.","room_gf-majlis-entrance":"This is the main entrance, on the ground floor. It's about two by four and a half metres, roughly eight square metres. It's double height, two floors tall, so the first step in already feels grand.","room_gf-lobby":"This is the entrance lobby, on the ground floor. It quietly splits the house: guests go one way, the family the other.","room_gf-majlis":"This is the men's majlis, on the ground floor. It's about three and a half by five and a half metres, roughly twenty square metres. Your guests sit here with their own garden view, and never cross the family side.","room_gf-wash":"This is the guest wash area, on the ground floor. It's about one and a half by two metres, roughly four square metres. Guests freshen up here without going anywhere near the family side.","room_gf-wc":"This is the guest toilet, on the ground floor. It's about one and a half by one and a half metres, roughly two square metres. A private toilet just for guests, right beside the majlis.","room_gf-office":"This is the office, on the ground floor. It's about three and a half by three and a half metres, roughly thirteen square metres. Work from home or meet a visitor here, without opening up the house.","room_gf-dining":"This is the dining room, on the ground floor. It's about four and a half by three and a half metres, roughly sixteen square metres. It sits between the majlis and the family side, so serving guests is easy.","room_gf-living-2":"This is the family hall, on the ground floor. It's about four by three and a half metres, roughly fourteen square metres. The family's own entrance is right here, so everyone comes and goes in privacy.","room_gf-entrance":"This is the family entrance, on the ground floor. It's about three by one and a half metres, roughly four square metres. The family comes in here, straight to their side, never through the guest areas.","room_gf-living":"This is the family living room, on the ground floor. It's about four by three and a half metres, roughly fourteen square metres. This is the heart of the home: bright, open, with the planted courtyard beside it.","room_gf-women-wash":"This is the family wash area, on the ground floor. It's about one by one and a half metres, roughly two square metres. A wash area just for the family, close to the living room.","room_gf-women-wc":"This is the family toilet, on the ground floor. It's about one by one and a half metres, roughly two square metres. The family's own toilet, separate from the guests'.","room_gf-kitchen":"This is the kitchen, on the ground floor. It's about four by three and a half metres, roughly fourteen square metres. Closed, with worktops all round, built-in ovens and a window over the sink. The maid's room is just behind it.","room_gf-maid-room":"This is the maid's room, on the ground floor. It's about two and a half by two metres, roughly five square metres. It has its own bathroom, with the laundry right next door.","room_gf-maid-bath":"This is the maid's bathroom, on the ground floor. It's about two and a half by one and a half metres, roughly four square metres. The maid has her own bathroom, right by her room.","room_gf-laundry":"This is the laundry, on the ground floor. It's about two and a half by one and a half metres, roughly four square metres. A proper laundry room, tucked behind the kitchen and out of sight.","room_gf-guard-room":"This is the driver's room, on the ground floor. It's about two by two metres, roughly five square metres. By the gate, with its own bathroom, completely separate from the house.","room_gf-guard-bath":"This is the driver's bathroom, on the ground floor. It's about one by two metres, roughly two square metres. The driver has his own bathroom, so he never needs to enter the house.","room_ff-living-2":"This is the family lounge, on the first floor. It's about three by three and a half metres, roughly twelve square metres. The family's own lounge upstairs, with a coffee corner and a terrace for fresh air.","room_ff-living":"This is the family lounge, on the first floor. It's about three by three and a half metres, roughly twelve square metres. A cosy family lounge, well away from guests.","room_ff-pantry":"This is the pantry, on the first floor. It's about two and a half by one and a half metres, roughly four square metres. A small pantry for tea and coffee, so nobody goes downstairs at night.","room_ff-bed-4":"This is the main suite, on the first floor. It's about four by three and a half metres, roughly fourteen square metres. Calm and generous, with a tall window, its own dressing room and bathroom.","room_ff-wardrobe-4":"This is the dressing room, on the first floor. It's about two and a half by one and a half metres, roughly four square metres. A walk-in dressing room, connected straight to the main suite.","room_ff-bath-4":"This is the main suite bathroom, on the first floor. It's about two and a half by one and a half metres, roughly four square metres. The main suite's private bathroom, through the dressing room.","room_ff-bed-3":"This is the second bedroom, on the first floor. It's about three and a half by three and a half metres, roughly thirteen square metres. Built-in wardrobes and its own bathroom.","room_ff-bath-3":"This is the second bedroom's bathroom, on the first floor. It's about two by two and a half metres, roughly six square metres. Private to the second bedroom, no sharing.","room_ff-corridor":"This is the bedroom corridor, on the first floor. Look down through the glass opening and you'll see the entrance below.","room_ff-bed-1":"This is the third bedroom, on the first floor. It's about three and a half by four metres, roughly fourteen square metres. The screened window lets light in and keeps your privacy.","room_ff-bath-1":"This is the third bedroom's bathroom, on the first floor. It's about two and a half by one and a half metres, roughly four square metres. Private to the third bedroom.","room_ff-bed-2":"This is the fourth bedroom, on the first floor. It's about three and a half by four metres, roughly fourteen square metres. A glass wardrobe and a wide window, with its own bathroom.","room_ff-bath-2":"This is the fourth bedroom's bathroom, on the first floor. It's about two and a half by one and a half metres, roughly four square metres. Private to the fourth bedroom.","room_sf-stairs":"This is the roof lobby, on the second floor. It's about one by three and a half metres, roughly four square metres. The top floor: a private suite, away from everything.","room_sf-pantry":"This is the upstairs pantry, on the second floor. It's about one by two and a half metres, roughly three square metres. Tea and coffee right by the guest suite.","room_sf-bath":"This is the guest suite bathroom, on the second floor. It's about two by two and a half metres, roughly four square metres. The guest suite's own bathroom.","room_sf-guest-room":"This is the guest suite, on the second floor. It's about three and a half by four metres, roughly fifteen square metres. A private suite for guests or a grown-up son, with the roof terrace right outside.","p0_0":"As you can see on the plan, this is the ground floor. You arrive at the arrival court, with parking for two cars.","p0_1":"Here by the gate, the driver's room, with its own bathroom.","p0_2":"Through the main door, the entrance: double height, two floors tall.","p0_3":"From the entrance, straight into the majlis, with the guests' wash area and toilet beside it.","p0_4":"Here, the office, right by the entrance.","p0_5":"Walk on, and the dining room sits between the majlis and the family side.","p0_6":"Here, the family's own entrance, opening into the family hall.","p0_7":"The family living room, by the planted courtyard, with the stair beside it.","p0_8":"From the living room, into the kitchen.","p0_9":"And behind it, the maid's room and the laundry.","p1_0":"Let's go up to the first floor. The stair brings you into the family lounge, the hub for every room.","p1_1":"From here into the main suite, then its dressing room, then the bathroom.","p1_2":"Here, the second bedroom, with its own bathroom.","p1_3":"Back to the lounge, and through this corridor.","p1_4":"It takes you to the third bedroom and its bathroom.","p1_5":"And opposite, the fourth, with its own bathroom.","p1_6":"And by the lounge, the pantry and the terrace.","p2_0":"And up the same stair to the second floor.","p2_1":"A complete guest suite: a bedroom, a bathroom and a pantry, opening onto the roof."},"ar":{"tour_0":"هلا والله وحيّاك الله طال عمرك، نوّرت فيلا A. ثلاثة أدوار، ومساحتها تقريباً ثلاثمية وتسعة وثمانين متر، وموقف لسيارتين. تفضّل معي، خلّني أوريك البيت.","tour_1":"خمس غرف نوم، ومجلس رجال، ومكتب، ومدخلين مستقلين، وغرفة للسواق وغرفة للخادمة. يعني كل اللي تحتاجه العايلة.","tour_2":"وقبل ما ندخل، هنا عند البوابة، غرفة السواق بدورة مياهها، مستقلة تماماً عن البيت.","tour_3":"والحين نرجع للباب الرئيسي. تفضّل طال عمرك.","tour_4":"وهذا المدخل الرئيسي. وتشوف طال عمرك المدخل دبل هايت، بارتفاع دورين، يعطيك الفخامة من أول خطوة.","tour_5":"على يسارك وأنت داخل، مجلس الرجال. ضيوفك يدخلون هنا على طول، وما يمرّون على جهة العايلة أبد.","tour_6":"وإذا طالعت برّا، حديقة خاصة قدّام الجلسة. جلسة تفتح النفس، صح؟","tour_7":"وجنب المجلس على طول، مغاسل ودورة مياه خاصة للضيوف.","tour_8":"ونرجع للمدخل. إذا طالعت يمينك، المكتب. تشتغل فيه أو تستقبل زائر، والبيت على راحته.","tour_9":"وقدّامك على طول، غرفة الطعام. بين المجلس وصالة العايلة، يعني الضيافة سهلة ومريحة.","tour_10":"تعال معي طال عمرك. على يمينك مدخل العايلة الخاص، ورا هالساتر. يدخلون ويطلعون براحتهم.","tour_11":"وقدّامك صالة المعيشة. مفتوحة ومنوّرة، وهي قلب البيت.","tour_12":"وعلى الجهة الثانية الدرج، يلتف حول فناء مزروع، ويوصّل النور لوسط البيت.","tour_13":"وبعدها المطبخ. مطبخ مغلق، أسطح عمل من كل جهة، وأفران مدمجة، وشباك فوق المغسلة.","tour_14":"وورا المطبخ غرفة الخادمة، بدورة مياهها وغرفة الغسيل. وغرفة السواق مثل ما شفنا، عند البوابة.","tour_15":"خلّنا نطلع للدور الأول طال عمرك. هذا الدور للعايلة وبس: أربع غرف نوم رئيسية، كل غرفة بدورة مياهها.","tour_16":"أول ما تطلع، صالة العايلة، وعلى يمينها ركن القهوة، وبعده تراس للهوا الطلق.","tour_17":"نبدأ بالغرفة الرئيسية. هادية ووسيعة، وشباكها طويل.","tour_18":"ومن هنا غرفة الملابس، وعلى يسارها دورة مياه خاصة.","tour_19":"وجنبها غرفة النوم الثانية، بدواليبها ودورة مياهها.","tour_20":"تعال من هالممر. إذا طالعت تحت، تشوف المدخل من الفتحة الزجاجية، وهي توصّل النور لجناح غرف النوم.","tour_21":"وإذا طالعت يمينك، غرفة النوم الثالثة. شباكها بساتر، يدخّل النور ويحفظ الخصوصية.","tour_22":"وإذا طالعت يسارك، الرابعة، بدولاب زجاجي وشباك واسع.","tour_23":"وآخر شي، نطلع للدور الثاني طال عمرك. جناح مستقل، بعيد عن كل شي.","tour_24":"غرفة نوم كاملة، وجنبها دورة مياه ومطبخ تحضيري. للضيوف، أو لواحد من العيال، على كيفك.","tour_25":"وإذا طالعت برّا، تراس السطح. تخيّل سهراتكم هنا.","tour_26":"وإذا عجبك اللي شفته طال عمرك، سجّل اهتمامك، ونرتّب لك زيارة خاصة على راحتك. وحيّاك الله.","greet":"هلا والله وحيّاك الله طال عمرك، نوّرت فيلا A! كيف أقدر أخدمك اليوم؟ وش حاب تعرف عن الفيلا؟","greet_salam":"وعليكم السلام ورحمة الله وبركاته، حيّاك الله طال عمرك ونوّرت! كيف أقدر أخدمك اليوم؟","greet_morning":"صباح النور والسرور، حيّاك الله طال عمرك! كيف أقدر أخدمك؟","greet_evening":"مساء النور، حيّاك الله طال عمرك! كيف أقدر أخدمك؟","hey":"هلا والله!","howru":"بخير الحمدلله، الله يسلمك ويعافيك. وأنت كيف حالك طال عمرك؟","greet_howru":"هلا والله وحيّاك الله! بخير الحمدلله، الله يسلمك. وأنت كيف حالك طال عمرك؟","fine":"الحمدلله، دوم يا رب. تبي أبدأ لك الجولة، ولا أوديك لأي غرفة على كيفك؟","okay":"أبشر. وين تحب نروح الحين طال عمرك؟ المجلس، المطبخ، ولا غرف النوم فوق؟","who":"أنا مرشدك في فيلا A في أنارا طال عمرك. أعرف كل زاوية في البيت، فاسألني اللي تبي، بالعربي أو بالإنجليزي.","wow":"الله يطوّل عمرك، يزهاك البيت الطيب المبارك. وعشان تكتمل الصورة، خلّني أوريك المدخل الرئيسي، دبل هايت بارتفاع دورين. نروح له؟","thanks":"العفو طال عمرك، حيّاك الله. تبي أوريك شي ثاني؟","bye":"شكراً على زيارتك طال عمرك، تشرّفت فيك. وإذا تحب تشوفها على الطبيعة، أحجز لك زيارة خاصة على راحتك.","help":"اسألني اللي يهمك طال عمرك: مساحات الغرف، غرف النوم، الأدوار، المواقف، الخصوصية، الموقع، السعر والتسليم. أو قل لي، ودّني المجلس، وأوديك.","unknown":"والله طال عمرك، هالمعلومة ما هي متوفرة عندي تحديداً. وأقدر أخلي أحد من فريق أنارا يتواصل معك، إذا حبيت تسجّل رقمك وإيميلك والوقت المناسب لك. والشباب ما بيقصّرون معك، بيوفرون لك كل البيانات اللي تحتاجها، وأبشر باللي تبيه. تبي أفتح لك التسجيل؟","noProb":"ولا يهمك طال عمرك. وش تحب نسوي الحين؟","come":"أبشر، تفضّل معي.","come2":"أبشر، أفتح لك منصة أنارا.","yesroom":"إيه نعم طال عمرك، موجودة. تفضّل معي أوريك.","opinion":"بصراحة طال عمرك؟ بيت مدروس لعايلة سعودية: الضيوف لهم جهتهم ومجلسهم، والعايلة لها مدخلها وخصوصيتها، وكل غرفة نوم بدورة مياهها. وإذا طالعت حولك، تحس بالنور والراحة. تبي أوريك أحلى زاوية في البيت؟","worth":"القرار لك طال عمرك. اللي يميزها الخصوصية بين الضيوف والعايلة، ودورة مياه لكل غرفة نوم، ودور كامل للعايلة بس. وفريق المبيعات يعطيك الأرقام كاملة وتقارن على راحتك. تبي يتواصلون معك؟","neg":"أفهمك طال عمرك، والصور أحياناً ما تعطي إحساس المكان الحقيقي. ولو تحب الوسع، المجلس وصالة المعيشة من أوسع المساحات. تبي أوديك؟","off":"ههه، سؤال حلو والله! بس أنا تخصصي هالبيت طال عمرك. خلّني أفيدك فيه: تبي نروح المجلس، ولا نطلع لغرف النوم فوق؟","off2":"والله ما عندي فكرة طال عمرك! أنا آخر علمي هالبيت. تبي أوريك أحلى ركن فيه؟","off3":"هذي أكبر مني طال عمرك! أنا شغلتي الغرف والمقاسات. تعال أوريك المجلس، وأضمن لك يعجبك.","off4":"لا والله ما أقدر أجاوب على سؤال زي كذا طال عمرك! بس اسألني عن البيت، وأبشر بالسعد.","off5":"الكورة؟ أخاف أقول رأيي وتزعل علي طال عمرك! خلّنا في البيت أسلم. تبي نشوف صالة المعيشة؟","disc":"ودّي والله طال عمرك! بس الأسعار والعروض عند فريق المبيعات، وأنا أوصّل لهم طلبك. تبي يتواصلون معك؟","sorry":"سامحني طال عمرك إذا ما فهمتك صح. جرّب تسألني بطريقة ثانية، أو قل لي وش تبي تشوف.","next":"تعال معي طال عمرك، خلّني أوريك اللي بعده.","sure":"إيه أكيد طال عمرك، هالأرقام من مخططات أنارا المعتمدة.","lives":"لسا محد طال عمرك. البيت ينتظر أهله، ويمكن تكونون أنتم.","brief":"حيّاك الله طال عمرك. الفيلا ثلاثة أدوار، ومساحتها حوالي ثلاثمية وتسعة وثمانين متر. فيها خمس غرف نوم، كل غرفة بدورة مياهها، وتسع دورات مياه بالكامل. الأرضي للضيافة والعايلة: مجلس رجال بحديقته، ومكتب عند المدخل، وغرفة طعام، وصالة معيشة على فناء مزروع، ومطبخ مغلق. والأول للعايلة وبس: أربع غرف نوم رئيسية، وصالة، وتراس. وفوق جناح ضيوف يطل على السطح. وأحلى ما فيها؟ إن الضيف ما يمر على جهة العايلة أبد. نبدأ من المجلس؟","near":"سؤال مهم طال عمرك. المشروع في الرياض، على بعد حوالي خمسة وعشرين دقيقة من مطار الملك خالد، وخريطة منصة أنارا توريك المدارس والمساجد والخدمات اللي حوله. تبي أفتحها لك؟","measureGo":"أبشر، المسطرة جاهزة. المس نقطة البداية على الأرض، وبعدها نقطة النهاية للمكان اللي تحب تقيسه. ولو تبي الارتفاع، المس الأرض وبعدها اطلع لفوق.","nosize":"طال عمرك، هالمكان ما له مقاس محدد في المخطط. بس تقدر تقيسه بنفسك بالمسطرة، تبي أفتحها لك؟","height":"ارتفاع السقف ما هو مكتوب في المخطط طال عمرك، بس تقدر تقيسه بنفسك: المس الأرض عند الجدار، وبعدها اطلع لفوق عند السقف. تبي أفتح لك المسطرة؟","beds":"خمس غرف نوم طال عمرك. أربع غرف رئيسية في الدور الأول، كل غرفة بدورة مياهها، وجناح ضيوف مستقل في الدور الثاني.","baths":"تسع دورات مياه بالكامل. كل غرفة نوم لها دورة مياهها، وللضيوف مغاسل ودورة مياه مستقلة، وللخادمة والسواق كل واحد دورة مياهه.","floors":"ثلاثة أدوار طال عمرك. الأرضي للضيافة والعايلة، والأول للعايلة وبس فيه أربع غرف نوم رئيسية، والثاني جناح ضيوف مع السطح.","area":"المساحة حوالي ثلاثمية وتسعة وثمانين متر مربع: تقريباً مية وتسعين في الأرضي، ومية واثنين وخمسين في الأول، وسبعة وأربعين في الثاني.","fl0":"الدور الأرضي فيه ساحة الوصول، ومجلس الرجال بحديقته، والمكتب، وغرفة الطعام، وصالة المعيشة على الفناء المزروع، والمطبخ المغلق وغرفة الغسيل، وغرفة الخادمة وغرفة السواق.","fl1":"الدور الأول للعايلة وبس طال عمرك: أربع غرف نوم رئيسية بدورات مياهها، وغرفة ملابس، وصالة العايلة مع ركن القهوة، ومطبخ تحضيري، وتراس.","fl2":"الدور الثاني جناح ضيوف مستقل، بدورة مياهه ومطبخه التحضيري، ويطل على تراس السطح.","largest":"أوسع غرفة طال عمرك مجلس الرجال، تقريباً عشرين متر مربع. تعال أوريك.","smallest":"أصغر مساحة مغسلة العايلة، أقل من مترين مربع.","price":"الأسعار وخطط الدفع عند فريق مبيعات أنارا طال عمرك، عشان تكون محدّثة دايماً. تبي أخليهم يتواصلون معك بأحدث العروض؟","avail":"التوفّر لكل فيلا موجود على المخطط العام في منصة أنارا طال عمرك، وتشوف المتاح والمحجوز والمباع.","handover":"مواعيد التسليم وسير البناء يأكدها فريق مبيعات أنارا طال عمرك. سجّل بياناتك ويطلعونك على كل جديد.","visit":"أبشر بسعدك طال عمرك. سجّل اسمك ورقمك، وفريق أنارا يرتّب لك زيارة خاصة.","loc":"أنارا من سمو في الرياض طال عمرك، على بعد حوالي خمسة وعشرين دقيقة بالسيارة من مطار الملك خالد الدولي، ومنصة أنارا توريك الموقع كامل وأوقات الوصول.","dev":"أنارا من تطوير شركة سمو طال عمرك.","hl":"اللي يميزها طال عمرك: مدخل رئيسي ومدخل عايلة مستقلين، ومدخل دبل هايت بارتفاع دورين، ومكتب عند الباب، ومطبخ بجهة خدمة خاصة، ودورة مياه لكل غرفة نوم، وجناح ضيوف مع السطح.","park":"موقف لسيارتين طال عمرك، في ساحة الوصول قدّام الفيلا.","privacy":"الخصوصية أساس التصميم طال عمرك. الضيوف يدخلون من المدخل الرئيسي للمجلس بدون ما يمرّون على جهة العايلة، والعايلة لها مدخلها الخاص، والدور الأول كله لها.","outdoor":"ثلاث مساحات خارجية طال عمرك: الفناء المزروع في وسط الدور الأرضي، وتراس صالة العايلة فوق، وتراس السطح جنب جناح الضيوف.","pool":"المسبح ما هو ضمن مخططات الفيلا طال عمرك. والمساحات الخارجية: الفناء المزروع، وتراس الدور الأول، وتراس السطح.","lift":"المخططات ما فيها مصعد طال عمرك. الدرج يلتف حول الفناء المزروع ويربط الأدوار الثلاثة، وفريق المبيعات يفيدك بأي خيارات.","staff":"إيه نعم طال عمرك. غرفة الخادمة بدورة مياهها وغرفة الغسيل ورا المطبخ، وغرفة السواق بدورة مياهها عند البوابة، مستقلة تماماً عن البيت.","family":"مناسبة جداً للعايلة الكبيرة طال عمرك: خمس غرف نوم بدورات مياهها، ودور كامل للعايلة، وصالتين، وغرف مستقلة للخادمة والسواق.","spec":"التشطيبات والتكييف والمنزل الذكي والضمانات كلها في جدول مواصفات أنارا طال عمرك. تبي أخلي فريق المبيعات يرسله لك؟","furn":"الأثاث في الجولة يوضّح لك كيف ممكن تعيش في البيت طال عمرك، وفريق المبيعات يأكد لك وش يشمل العرض بالضبط.","custom":"أي تعديلات على التصميم أو التشطيبات تتناقش مع فريق مبيعات أنارا طال عمرك. تبي يتواصلون معك؟","other":"أنارا فيها ثلاثة نماذج طال عمرك: هذا النموذج A، والنموذج D، والنموذج C دوبلكس. وكل نموذج له جولته على منصة أنارا.","tour":"أبشر طال عمرك، تفضّل معي.","plan":"هذا مخطط الفيلا طال عمرك، المس أي غرفة وأوديك لها.","facts":"هذي أهم أرقام الفيلا طال عمرك.","share":"هذا رابط لنفس المنظر اللي تشوفه، شاركه مع اللي تبي.","music":"تم طال عمرك.","go":"تفضّل معي طال عمرك.","room_gf-porch":"هنا ساحة الوصول، في الدور الأرضي. تكفي لسيارتين براحة، والباب الرئيسي قدّامك على طول.","room_gf-majlis-entrance":"هنا المدخل الرئيسي، في الدور الأرضي. المقاس تقريباً اثنين متر في أربعة ونص، يعني حوالي ثمانية متر مربع. وتشوف طال عمرك المدخل دبل هايت، بارتفاع دورين، يعطيك الفخامة من أول خطوة.","room_gf-lobby":"هنا بهو المدخل، في الدور الأرضي. هو اللي يفصل البيت بهدوء: الضيوف من جهة، والعايلة من جهة.","room_gf-majlis":"هنا مجلس الرجال، في الدور الأرضي. المقاس تقريباً ثلاثة ونص متر في خمسة ونص، يعني حوالي عشرين متر مربع. هنا تستقبل ضيوفك، وقدّامهم حديقة خاصة، وما يمرّون على جهة العايلة أبد.","room_gf-wash":"هنا مغاسل الضيوف، في الدور الأرضي. المقاس تقريباً واحد ونص متر في اثنين، يعني حوالي أربعة متر مربع. الضيف يتوضّا ويغسل هنا، بدون ما يقرّب من جهة العايلة.","room_gf-wc":"هنا دورة مياه الضيوف، في الدور الأرضي. المقاس تقريباً واحد ونص متر في واحد ونص، يعني حوالي اثنين متر مربع. دورة مياه خاصة للضيوف، جنب المجلس على طول.","room_gf-office":"هنا المكتب، في الدور الأرضي. المقاس تقريباً ثلاثة ونص متر في ثلاثة ونص، يعني حوالي ثلطعش متر مربع. تشتغل فيه أو تستقبل زائر، والبيت على راحته.","room_gf-dining":"هنا غرفة الطعام، في الدور الأرضي. المقاس تقريباً أربعة ونص متر في ثلاثة ونص، يعني حوالي سطعش متر مربع. موقعها بين المجلس وجهة العايلة، يعني الضيافة سهلة ومريحة.","room_gf-living-2":"هنا صالة العايلة، في الدور الأرضي. المقاس تقريباً أربعة متر في ثلاثة ونص، يعني حوالي أربعطعش متر مربع. مدخل العايلة الخاص هنا، يدخلون ويطلعون براحتهم.","room_gf-entrance":"هنا مدخل العايلة، في الدور الأرضي. المقاس تقريباً ثلاثة متر في واحد ونص، يعني حوالي أربعة متر مربع. العايلة تدخل من هنا على جهتها مباشرة، بدون ما تمر على الضيوف.","room_gf-living":"هنا صالة المعيشة، في الدور الأرضي. المقاس تقريباً أربعة متر في ثلاثة ونص، يعني حوالي أربعطعش متر مربع. هذي قلب البيت: مفتوحة ومنوّرة، وجنبها الفناء المزروع.","room_gf-women-wash":"هنا مغسلة العايلة، في الدور الأرضي. المقاس تقريباً واحد متر في واحد ونص، يعني حوالي اثنين متر مربع. مغسلة خاصة للعايلة، قريبة من صالة المعيشة.","room_gf-women-wc":"هنا دورة مياه العايلة، في الدور الأرضي. المقاس تقريباً واحد متر في واحد ونص، يعني حوالي اثنين متر مربع. دورة مياه خاصة للعايلة، غير حقّت الضيوف.","room_gf-kitchen":"هنا المطبخ، في الدور الأرضي. المقاس تقريباً أربعة متر في ثلاثة ونص، يعني حوالي أربعطعش متر مربع. مطبخ مغلق، أسطح عمل من كل جهة، وأفران مدمجة، وشباك فوق المغسلة. وغرفة الخادمة وراه على طول.","room_gf-maid-room":"هنا غرفة الخادمة، في الدور الأرضي. المقاس تقريباً اثنين ونص متر في اثنين، يعني حوالي خمسة متر مربع. لها دورة مياهها، وغرفة الغسيل جنبها.","room_gf-maid-bath":"هنا دورة مياه الخادمة، في الدور الأرضي. المقاس تقريباً اثنين ونص متر في واحد ونص، يعني حوالي أربعة متر مربع. للخادمة دورة مياهها الخاصة، جنب غرفتها.","room_gf-laundry":"هنا غرفة الغسيل، في الدور الأرضي. المقاس تقريباً اثنين ونص متر في واحد ونص، يعني حوالي أربعة متر مربع. غرفة غسيل مستقلة، ورا المطبخ وبعيدة عن العين.","room_gf-guard-room":"هنا غرفة السواق، في الدور الأرضي. المقاس تقريباً اثنين متر في اثنين، يعني حوالي خمسة متر مربع. عند البوابة، بدورة مياهها، ومستقلة تماماً عن البيت.","room_gf-guard-bath":"هنا دورة مياه السواق، في الدور الأرضي. المقاس تقريباً واحد متر في اثنين، يعني حوالي اثنين متر مربع. للسواق دورة مياهه الخاصة، ما يحتاج يد oom_ff-bath-2":"هنا دورة مياه الغرفة الرابعة، في الدور الأول. المقاس تقريباً اثنين ونص متر في واحد ونص، يعني حوالي أربعة متر مربع. خاصة بالغرفة الرابعة.","room_sf-stairs":"هنا بهو السطح، في الدور الثاني. المقاس تقريباً واحد متر في ثلاثة ونص، يعني حوالي أربعة متر مربع. آخر دور: جناح مستقل، بعيد عن كل شي.","room_sf-pantry":"هنا المطبخ التحضيري فوق، في الدور الثاني. المقاس تقريباً واحد متر في اثنين ونص، يعني حوالي ثلاثة متر مربع. شاي وقهوة جنب جناح الضيوف على طول.","room_sf-bath":"هنا دورة مياه الجناح، في الدور الثاني. المقاس تقريباً اثنين متر في اثنين ونص، يعني حوالي أربعة متر مربع. دورة المياه الخاصة بالجناح.","room_sf-guest-room":"هنا جناح الضيوف، في الدور الثاني. المقاس تقريباً ثلاثة ونص متر في أربعة، يعني حوالي خمسطعش متر مربع. جناح مستقل للضيوف أو لواحد من العيال، والسطح قدّامه على طول.","p0_0":"زي ما تشوف هنا في المخطط طال عمرك، هذا الدور الأرضي. تدخل من ساحة الوصول، وفيها موقف لسيارتين.","p0_1":"وهنا عند البوابة، غرفة السواق بدورة مياهها.","p0_2":"ومن الباب الرئيسي تدخل للمدخل، دبل هايت بارتفاع دورين.","p0_3":"ومن المدخل على طول للمجلس، وجنبه مغاسل ودورة مياه الضيوف.","p0_4":"وهنا المكتب، عند المدخل على طول.","p0_5":"ولو تمشي لقدّام، غرفة الطعام بين المجلس وجهة العايلة.","p0_6":"وهنا مدخل العايلة الخاص، يفتح على صالة العايلة.","p0_7":"وصالة المعيشة على الفناء المزروع، وجنبها الدرج.","p0_8":"ومن الصالة تدخل المطبخ.","p0_9":"ووراه غرفة الخادمة وغرفة الغسيل.","p1_0":"خلّنا نطلع للدور الأول طال عمرك. تطلع من الدرج على صالة العايلة، وهي الموزّع لكل الغرف.","p1_1":"من هنا تدخل الغرفة الرئيسية، ومنها لغرفة الملابس، وبعدها دورة المياه.","p1_2":"وهنا غرفة النوم الثانية، بدورة مياهها.","p1_3":"وترجع للموزّع، وتدخل من هالممر.","p1_4":"يوديك لغرفة النوم الثالثة بدورة مياهها.","p1_5":"وقبالها الرابعة، بدورة مياهها.","p1_6":"وجنب الصالة المطبخ التحضيري والتراس.","p2_0":"ونطلع للدور الثاني من نفس الدرج.","p2_1":"جناح ضيوف كامل: غرفة نوم، ودورة مياه، ومطبخ تحضيري، ويطل على السطح."}};

      if(labels){const l=document.createElement("span");l.className="plbl"+(/bath|wc|wash|laundry|wardrobe|corridor|lobby|entrance|living-2|pantry|stairs/.test(p.id)?" minor":/maid-room|guard-room/.test(p.id)?" noar":"");l.style.left=p.x+"%";l.style.top=p.y+"%";l.innerHTML=nm(p)+(p.dims?"<small>≈ "+fmt(p.dims[0]*p.dims[1],1)+" "+t("m2")+"</small>":"");pins.appendChild(l)}});
    cn=document.createElementNS("http://www.w3.org/2000/svg","svg");cn.setAttribute("viewBox","-55 -55 110 110");cn.classList.add("cone");

    pins.appendChild(cn);mark()}
  function mark(){pins.querySelectorAll(".pin").forEach(b=>b.setAttribute("aria-current",!!cur&&b.dataset.id===cur.id));if(cn){const on=cur&&cur.floor===fi;cn.style.display=on?"block":"none";if(on){cn.style.left=cur.x+"%";cn.style.top=cur.y+"%"}}
    if(root.id==="miniMap"){const z=(typeof tourOn!=="undefined"&&tourOn&&cur&&cur.floor===fi)?2.3:1;[img,pins].forEach(el=>{el.style.transformOrigin=(cur?cur.x:50)+"% "+(cur?cur.y:50)+"%";el.style.transition="transform 1.1s cubic-bezier(.22,1,.36,1)";el.style.transform="scale("+z+")"});root.style.setProperty("--z",z)}}
  root.addEventListener("click",e=>{if(e.target.closest(".pin")||root.dataset.dragged==="1")return;e.stopPropagation();const b=img.getBoundingClientRect(),f=FLOORS[fi];
    const x=(e.clientX-b.left)/b.width*100,y=(e.clientY-b.top)/b.height*100;let best=null,bd=1e9;
    P.filter(p=>p.floor===fi).forEach(p=>{const d=Math.hypot((p.x-x)*f.w,(p.y-y)*f.h);if(d<bd){bd=d;best=p}});
    if(best&&bd<f.w*.16){onPick&&onPick();stopTour();go(best.id)}});
  let lastA=-1;
  function setFov(h){if(!cn)return;const a=Math.round(Math.max(16,Math.min(42,h/2.4)));if(a===lastA)return;lastA=a;const r=a*D2R,R=54,x=(R*Math.cos(r)).toFixed(2),y=(R*Math.sin(r)).toFixed(2),e=(30*Math.cos(r)).toFixed(2),f=(30*Math.sin(r)).toFixed(2);
    cn.querySelector(".cw").setAttribute("d","M0 0L"+x+" -"+y+"A"+R+" "+R+" 0 0 1 "+x+" "+y+"Z");cn.querySelector(".ce").setAttribute("d","M"+e+" -"+f+"L0 0L"+e+" "+f)}
  return{render,mark,get floor(){return fi},set rot(a){if(cn)cn.style.transform="rotate("+a+"deg)"},set fov(h){setFov(h)}}}

let Z=1,TX=0,TY=0,baseW=0,baseH=0;const bv=$("bigView"),bm=$("bigMap");
function openBig(){closePops();$("big").hidden=false;big.render(cur.floor);bigFloors();requestAnimationFrame(()=>fitPlan(false))}

function fitPlan(focus){const f=FLOORS[big.floor],vw=bv.clientWidth,vh=bv.clientHeight;const k=Math.min(vw/f.w,vh/f.h);baseW=f.w*k;baseH=f.h*k;bm.style.width=baseW+"px";
  Z=1;TX=(vw-baseW)/2;TY=(vh-baseH)/2;
  if(focus&&cur&&cur.floor===big.floor){zoomAt(vw/2,vh/2,1.6,true);const px=cur.x/100*baseW*Z,py=cur.y/100*baseH*Z;TX=vw/2-px;TY=vh/2-py}
  applyZ(false)}
function clampT(){const vw=bv.clientWidth,vh=bv.clientHeight,w=baseW*Z,h=baseH*Z;
  TX=w<=vw?(vw-w)/2:Math.min(0,Math.max(vw-w,TX));TY=h<=vh?(vh-h)/2:Math.min(0,Math.max(vh-h,TY))}
function applyZ(a){clampT();bm.style.transition=a?"transform .35s cubic-bezier(.22,1,.36,1)":"none";bm.style.transform=`translate(${TX}px,${TY}px) scale(${Z})`;bm.style.setProperty("--z",Z);$("bigMap").classList.toggle("zin",Z>=2.2)}
function zoomAt(cx,cy,nz,silent){nz=Math.max(1,Math.min(6,nz));const k=nz/Z;TX=cx-(cx-TX)*k;TY=cy-(cy-TY)*k;Z=nz;if(!silent)applyZ(true)}
function vpPt(e){const r=bv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
bv.addEventListener("wheel",e=>{e.preventDefault();const[x,y]=vpPt(e);const nz=Math.max(1,Math.min(6,Z*Math.exp(-e.deltaY*.0022)));const k=nz/Z;TX=x-(x-TX)*k;TY=y-(y-TY)*k;Z=nz;applyZ(false)},{passive:false});
bv.addEventListener("dblclick",e=>{const[x,y]=vpPt(e);zoomAt(x,y,Z<5?Z*2:1)});
const bp=new Map();let pan0=null,pinchD=0,pinchZ=1,dragMoved=0;
bv.addEventListener("pointerdown",e=>{bp.set(e.pointerId,vpPt(e));dragMoved=0;bm.dataset.dragged="0";
  if(bp.size===1)pan0={x:vpPt(e)[0],y:vpPt(e)[1],tx:TX,ty:TY};
  if(bp.size===2){const[a,b]=[...bp.values()];pinchD=Math.hypot(a[0]-b[0],a[1]-b[1]);pinchZ=Z}});
bv.addEventListener("pointermove",e=>{if(!bp.has(e.pointerId))return;bp.set(e.pointerId,vpPt(e));
  if(bp.size===1&&pan0){const[x,y]=vpPt(e);dragMoved=Math.max(dragMoved,Math.hypot(x-pan0.x,y-pan0.y));
    if(dragMoved>5){if(!bv.hasPointerCapture(e.pointerId))bv.setPointerCapture(e.pointerId);bv.classList.add("drag");bm.dataset.dragged="1";TX=pan0.tx+x-pan0.x;TY=pan0.ty+y-pan0.y;applyZ(false)}}
  else if(bp.size===2){const[a,b]=[...bp.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    const nz=Math.max(1,Math.min(6,pinchZ*d/pinchD)),k=nz/Z;TX=cx-(cx-TX)*k;TY=cy-(cy-TY)*k;Z=nz;bm.dataset.dragged="1";applyZ(false)}});
function bpUp(e){bp.delete(e.pointerId);bv.classList.remove("drag");if(bp.size===1){const p=[...bp.values()][0];pan0={x:p[0],y:p[1],tx:TX,ty:TY}}else if(!bp.size)pan0=null;

/* ======================= MUSIC — plays a licensed track file (set MUSIC_SRC); the button stays hidden until one is set ======================= */
/* UI sounds: tiny synthesised clicks (no files); always on. The sound button switches the home ambience and the tour narrator together. */
let actx=null,uiLast=0;


/* Interface sounds in the spirit of a clean, minimal sonic brand: very short, soft, pure tones with a quick pitch glide and no echo. tap = a dry "tock"; move = a low rounded pop; open = a small rise; close = a small fall; floor = one quiet two-note chime. */
