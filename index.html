<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Anara Villa A">
<meta name="theme-color" content="#262b16">
<title>Anara Villa Type A Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Anara tokens — liquid-glass chrome over a full-bleed panorama.
   Layout: logo + breadcrumb top-start · floor switcher top-centre · language top-end · tool rail on the end edge ·
   room card bottom-start · room dock bottom-centre · minimap + actions bottom-end. */
:root{
  --olive-950:#262b16; --olive-900:#3f4727; --olive-700:#5f654a; --olive-500:#80856e; --olive-200:#c6c8bd; --olive-50:#eaebe7;
  --gold-600:#9b9265; --gold-500:#b0a57a; --gold-300:#d3ccb3; --gold-200:#e4dfd0; --gold-50:#f5f4ee;
  --night-900:#12150a;
  --ink:#1d2110; --ink-muted:#1d2110b3; --ink-light:#f3f1e7;
  --tint:#ffffff85; --tint-strong:#ffffffc2; --tint-dark:#14180a8f; --rim:#ffffff80; --radius:.75rem;
  --primary:var(--olive-900); --primary-fg:var(--gold-50);
  --ease-swell:cubic-bezier(.34,1.56,.64,1); --ease-soft:cubic-bezier(.22,1,.36,1);
  --f:"IBM Plex Sans Arabic",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --top:calc(env(safe-area-inset-top,0px) + 16px); --bot:calc(env(safe-area-inset-bottom,0px) + 16px);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--night-900);color:var(--ink);font-family:var(--f);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--olive-900);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}#stage.go{cursor:pointer}
body.measuring #stage{cursor:crosshair}
#stage canvas{display:block;width:100%;height:100%}
/* soft vignette so glass chrome always reads */
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(#0f120859,#0f120800 18%),linear-gradient(0deg,#0f120866,#0f120800 26%)}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;color:var(--ink);border-radius:999px;box-shadow:0 12px 32px -10px rgba(18,21,10,.42),0 2px 6px rgba(18,21,10,.14)}
.glass::before,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;transition:inset .7s var(--ease-swell)}
.glass::before{backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.glass::after{background:var(--tint);box-shadow:inset 2px 2px 1px #ffffff80,inset -1px -1px 1px 1px #ffffff80}
.glass.ink-light{color:var(--ink-light)}.glass.ink-light::after{background:var(--tint-dark)}
.glass.card{border-radius:calc(var(--radius) * 1.5)}.glass.card::after{background:var(--tint-strong)}
.glass.hov:hover::before,.glass.hov:hover::after{inset:-3px}
.chip{height:34px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.chip:hover{background:#ffffff4d;box-shadow:inset 0 1px 0 #ffffffb3}
.chip[aria-pressed="true"],.chip[aria-current="true"],.chip[aria-selected="true"]{background:var(--olive-900);color:var(--gold-50);box-shadow:inset 0 1px 0 #ffffff26,0 6px 16px -6px #1e220e99}
.ibtn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;transition:background .2s,color .2s;position:relative}
.ibtn:hover{background:#ffffff26}
.ibtn svg{transition:scale .6s var(--ease-swell)}.ibtn:hover svg{scale:1.1}
.ibtn[aria-pressed="true"]{background:var(--olive-500);color:#fff;box-shadow:inset 0 1px 0 #ffffff40}
#big .ibtn:hover,#mini .ibtn:hover{background:#ffffff66}
.ibtn[data-tip]::after{content:attr(data-tip);position:absolute;inset-inline-end:calc(100% + 10px);top:50%;transform:translateY(-50%) translateX(4px);white-space:nowrap;
  padding:6px 11px;border-radius:999px;background:var(--olive-950);color:var(--gold-50);font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .15s,transform .25s var(--ease-soft)}
[dir="rtl"] .ibtn[data-tip]::after{transform:translateY(-50%) translateX(-4px)}
.ibtn[data-tip]:hover::after,.ibtn[data-tip]:focus-visible::after{opacity:1;transform:translateY(-50%)}
@media (hover:none){.ibtn[data-tip]::after{display:none}}
.primary{height:44px;padding:0 20px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:9px;
  box-shadow:0 10px 28px -10px #1e220e8c;flex:0 0 auto;transition:transform .4s var(--ease-swell),background .2s}
.primary:hover{transform:translateY(-1px);background:var(--olive-950)}
.secondary{height:44px;padding:0 18px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:9px;flex:0 0 auto}
.chrome{transition:opacity .6s var(--ease-soft),transform .6s var(--ease-soft)}
body.presenting .chrome{opacity:0;pointer-events:none}
body:has(#intro:not([hidden]):not(.out)) :is(.chrome,.chrome-keep,#tags,.stairs,#arrows){opacity:0!important;pointer-events:none!important}
.chrome-keep{transition:opacity .6s var(--ease-soft)}
body.doll .pano-only{opacity:0;pointer-events:none}

/* ---------- top ---------- */
.tl{position:fixed;inset-inline-start:var(--gl);top:var(--top);z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.logo{width:108px;height:auto;display:block;--logo-star:#fff;--logo-word:#fff;filter:drop-shadow(0 1px 10px rgba(0,0,0,.35))}
.homebtn{display:block;border-radius:12px}
.crumb{display:flex;align-items:center;gap:7px;padding:7px 15px;font-size:12.5px;font-weight:500}
.crumb span{color:var(--ink-muted);font-weight:400}
.crumb svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;opacity:.5}
[dir="rtl"] .crumb svg{transform:scaleX(-1)}
.floors{position:fixed;top:var(--top);left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:4px}
.row2{display:flex;gap:8px;align-items:center}
.lang{display:flex;gap:2px;padding:4px;height:44px;align-items:center}
.lang .chip{height:32px;padding:0 12px;font-size:12.5px}

/* ---------- tool rail ---------- */
.tools{position:fixed;inset-inline-end:var(--gr);top:calc(var(--top) + 44px);z-index:6;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:28px}
.tools hr{border:0;height:1px;background:#f3f1e72e;margin:4px 10px}

/* ---------- room card ---------- */
.room{transition:opacity .6s var(--ease-soft);position:fixed;inset-inline-start:var(--gl);bottom:var(--bot);z-index:6;width:min(310px,calc(100vw - 32px));padding:16px 18px 14px}
.room .eyebrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-muted);font-weight:500}
[dir="rtl"] .room .eyebrow{letter-spacing:0}
.room .eyebrow .code{padding:1px 9px;border-radius:999px;background:var(--olive-900);color:var(--gold-50);font-variant-numeric:tabular-nums}
.room h1{margin:6px 0 0;font-size:clamp(24px,2.6vw,30px);font-weight:500;line-height:1.15;color:var(--ink);text-wrap:balance}
.room .ar2{font-size:14px;color:var(--ink-muted);margin-top:2px}
.room .meta{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid #1d21101a}
.room .meta div{display:flex;flex-direction:column;gap:1px}
.room .meta b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.room .meta span{font-size:11.5px;color:var(--ink-muted)}
.room .fin{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.room .fin li{font-size:12px;padding:4px 10px;border-radius:999px;background:#ffffff99;box-shadow:inset 0 0 0 1px #1d211014}
.room .note{font-size:11px;color:var(--ink-muted);margin-top:10px}
.room.collapsed .meta,.room.collapsed .fin,.room.collapsed .note{display:none}
.room .swap{animation:swapin .6s var(--ease-soft)}
@keyframes swapin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 54px);z-index:6;max-width:min(calc(100vw - 340px),860px)}
.rooms .chip{height:30px;font-size:13px;padding:0 12px}
.rooms{display:flex;gap:2px;padding:5px;overflow-x:auto;scrollbar-width:none;border-radius:999px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);scroll-padding-inline:24px}
.rooms::-webkit-scrollbar{display:none}
.rooms .gsep{flex:none;width:1px;align-self:stretch;margin:7px 5px;background:#1d211026}
.actions{position:fixed;inset-inline-end:var(--gr);bottom:var(--bot);z-index:6;display:flex;gap:8px;align-items:center}

/* ---------- minimap ---------- */
#mini{position:fixed;inset-inline-end:var(--gr);bottom:calc(var(--bot) + 62px);z-index:5;width:220px;padding:9px}
@media (max-height:640px){.room .note{display:none}.room h1{font-size:22px}.room .meta{margin-top:8px;padding-top:8px}.room{padding:12px 16px 12px}}
@media (max-height:820px) and (min-width:861px){#mini:not(.mid){width:180px}#mini header{font-size:11.5px}}
#mini header{display:flex;justify-content:space-between;align-items:center;padding:2px 5px 7px;font-size:12px;font-weight:600}
#mini header button{font-size:12px;font-weight:500;color:var(--ink-muted);display:flex;align-items:center;gap:4px}
#mini header svg{width:13px;height:13px}
.map{position:relative;border-radius:14px;overflow:hidden;background:var(--gold-200);line-height:0;cursor:pointer}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.map .pins{position:absolute;inset:0}
.pin{-webkit-appearance:none;appearance:none;scale:calc(1 / var(--z,1));position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--olive-900);border:0;padding:0;box-shadow:0 0 0 1.5px #fff,0 1px 3px #1e220e99;z-index:2;transition:scale .3s var(--ease-swell),background .2s}
.pin::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.pin:hover{scale:calc(1.35 / var(--z,1));background:var(--olive-500)}
.pin[aria-current="true"]{width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--olive-900);box-shadow:0 0 0 2.5px #fff,0 0 0 4px #3f472740,0 2px 6px #1e220e80;z-index:3}
.pin[aria-current="true"]::before{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--gold-300)}
.pin[aria-current="true"]::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid #3f4727aa;animation:pinPulse 2.2s ease-out infinite;pointer-events:none}
@keyframes pinPulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.cone{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;filter:drop-shadow(0 0 .6px #fff) drop-shadow(0 1px 2px #0006);pointer-events:none;z-index:1;overflow:visible;scale:calc(1 / var(--z,1));transition:opacity .3s}
#mini.mid .cone{width:58px;height:58px;margin:-29px 0 0 -29px}
#big .cone{width:70px;height:70px;margin:-35px 0 0 -35px}
.cone .cw{fill:url(#cg)}.cone .ce{display:none}
.plbl{scale:calc(1 / var(--z,1));transform-origin:0 0;position:absolute;transform:translate(-50%,12px);font-size:11.5px;font-weight:500;line-height:1.2;white-space:nowrap;padding:3px 8px;border-radius:999px;background:#ffffffe0;color:var(--ink);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);text-align:center}
.plbl small{display:block;font-size:10.5px;color:var(--olive-700);font-variant-numeric:tabular-nums}
#mini .plbl{display:none}
#mini{transition:width .45s var(--ease-soft)}
#mini.mid{width:min(440px,36vw)}
#mini.mid .plbl{font-size:10.5px;padding:2px 8px;transform:translate(-50%,10px);z-index:4}#mini.mid .pin:hover+.plbl{display:block}#mini.mid .plbl small{display:none}
#mini.mid .pin{width:10px;height:10px;margin:-5px 0 0 -5px}
#mini .sz{display:flex;align-items:center;gap:2px;padding:2px;border-radius:999px;background:#ffffff73;box-shadow:inset 0 0 0 1px #3f47271a}
#mini .sz button{width:28px;height:24px;font-size:11.5px;font-weight:600;border-radius:999px;display:grid;place-items:center;color:var(--olive-700);gap:0}
#mini .sz button:hover{background:#ffffffb3}
#mini .sz button[aria-pressed="true"]{background:var(--olive-900);color:var(--gold-50)}
#mini .sz svg{width:17px;height:14px}
#mini.mid{width:min(400px,30vw,calc((100vh - 300px) * .9))}

/* ---------- enlarged plan ---------- */
#big{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#12150a8c;
  padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gl)}
#big .sheet{width:min(100%,1040px);height:100%;display:flex;flex-direction:column;gap:10px;padding:14px;min-height:0}
#big .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#big .grp{display:flex;gap:2px;padding:3px;border-radius:999px;background:#ffffff59}
#big .viewport{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--gold-200);border-radius:14px;min-height:0;flex:1 1 0}
#big .viewport.drag{cursor:grabbing}
#big .map{margin:0;position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;border-radius:0;background:none}
#big .pin{width:12px;height:12px;margin:-6px 0 0 -6px;box-shadow:0 0 0 2.5px #f5f4eef2,0 2px 6px #1e220e80}
#big .pin[aria-current="true"]{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;box-shadow:0 0 0 3px var(--olive-900),0 0 0 5.5px #f5f4eee6,0 2px 8px #1e220e80}
#big .foot{font-size:12.5px;color:var(--ink-muted)}

/* ---------- pano overlays ---------- */
#hov::after{background:#3f4727e0}#hov{color:var(--gold-50)!important;position:fixed;left:0;top:0;z-index:4;padding:6px 13px;font-size:12.5px;font-weight:500;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
#hov.on{opacity:1}
#arrows{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.stairbtn{position:absolute;left:0;top:0;width:0;height:0;opacity:0;pointer-events:none;transition:opacity .3s}
.stairbtn.on{opacity:1;pointer-events:auto}
.stairbtn .arr{position:absolute;left:-28px;top:-28px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite;transition:scale .4s var(--ease-swell)}
.stairbtn .arr::after{background:#ffffffc4}
.stairbtn .arr svg{width:26px;height:26px;stroke:var(--olive-900);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stairbtn .lbl{position:absolute;left:0;top:36px;transform:translateX(-50%);white-space:nowrap;padding:5px 12px;font-size:12.5px;font-weight:500}
.stairbtn:hover .arr{scale:1.12}.stairbtn:hover .arr::after{background:var(--olive-900)}.stairbtn:hover .arr svg{stroke:var(--gold-50)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
#mlayer{position:fixed;inset:0;pointer-events:none;z-index:3}
#mlayer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mlbl{position:absolute;transform:translate(-50%,-50%);padding:5px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--top) + 104px);z-index:7;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;font-size:13px}
[dir="rtl"] .pill-bar{padding:6px 16px 6px 6px}
.pill-bar .chip{height:30px}

/* ---------- guided tour ---------- */
#tourbar .dots{display:flex;gap:4px}
body.touring #cap{z-index:30}
#tourbar .dots i{cursor:pointer;width:6px;height:6px;border-radius:50%;background:#1d211033;transition:background .3s,width .3s}
#tourbar .dots i.on{width:18px;border-radius:3px;background:var(--olive-900)}
#tourbar .dots i.done{background:var(--olive-500)}
body.presenting #tourbar{opacity:.25;transition:opacity .4s}
body.presenting #tourbar:hover{opacity:1}

#chap{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:8;padding:18px 30px 20px;text-align:center;display:flex;flex-direction:column;gap:4px;animation:capin .8s var(--ease-soft);transition:opacity .6s}
#chap.out{opacity:0}
#chap span{font-size:13px;color:var(--ink-muted);font-weight:500}
#chap b{font-size:30px;font-weight:500;line-height:1.2}
#summary{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;width:min(480px,calc(100vw - 32px));padding:26px 28px 24px}
#summary h2{margin:0 0 12px;font-size:24px;font-weight:500}
#summary ul{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
#summary li{font-size:14.5px;line-height:1.45;padding-inline-start:22px;position:relative}
#summary li::before{content:"";position:absolute;inset-inline-start:2px;top:.5em;width:8px;height:8px;border-radius:50%;background:var(--olive-900)}
#summary .row{display:flex;gap:8px;flex-wrap:wrap}
#summary .sumlead{margin:0 0 14px;font-size:14px;color:var(--ink-muted);line-height:1.5}
body.touring .actions,body.touring .room{opacity:0;pointer-events:none}
body.touring #mini{opacity:1;pointer-events:none}body.touring #mini header .sz,body.touring #mini #miniOpen{visibility:hidden}
body.touring:has(#factsPop:not([hidden])) #mini,body.touring:has(#regPop:not([hidden])) #mini{opacity:0}
#mini.glimpse{box-shadow:0 0 0 2px var(--gold-300),0 24px 60px -18px #000a}
#cap{position:fixed;inset-inline-start:var(--gl);bottom:var(--bot);z-index:12;width:min(600px,calc(100vw - 32px));padding:20px 24px 18px;border-radius:24px;color:var(--gold-50)}
#cap::after{background:linear-gradient(160deg,#12150ad1,#262b16c7)!important;box-shadow:inset 0 1px 0 #f5f4ee2e,inset 0 0 0 1px #f5f4ee14!important}
#cap .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;font-weight:500;color:var(--gold-300);margin-bottom:10px}
#cap .meta .step{font-variant-numeric:tabular-nums;color:#f5f4ee99}
#cap .head{display:block;font-size:clamp(22px,2.4vw,30px);font-weight:400;line-height:1.25;color:#fff;margin-bottom:6px;text-wrap:balance}
#cap p{margin:0;font-size:16px;line-height:1.65;color:#f5f4eed1;text-wrap:pretty;max-width:52ch}
#cap .prog{margin-top:16px;height:2px;border-radius:2px;background:#f5f4ee24;overflow:hidden}
#cap .prog i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--olive-200),var(--gold-300))}
[dir="rtl"] #cap .prog i{transform-origin:right center}
#cap .prog i.run{animation:capfill var(--d,5s) linear forwards}
body.tourpaused #cap .prog i.run{animation-play-state:paused}
@keyframes capfill{to{transform:scaleX(1)}}
#cap.in .head{animation:capin .7s var(--ease-soft) both}
#cap.in p{animation:capin .7s .12s var(--ease-soft) both}
@keyframes capin{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
body.presenting .room{opacity:0;pointer-events:none}
@media (max-width:860px){#cap{bottom:calc(var(--bot) + 8px);padding:16px 18px 14px}#cap p{font-size:14.5px}}
/* ---------- popovers ---------- */
.pop{position:fixed;z-index:25;width:min(320px,calc(100vw - 32px));padding:16px;display:flex;flex-direction:column;gap:10px}
.pop h3{margin:0;font-size:15px;font-weight:600}
.pop p{margin:0;font-size:12.5px;color:var(--ink-muted);line-height:1.5}
.pop .row{display:flex;gap:8px;flex-wrap:wrap}
.pop{user-select:text;-webkit-user-select:text}
.pop .link{font:12px/1.4 ui-monospace,Menlo,monospace;background:#ffffffb3;border-radius:10px;padding:8px 10px;word-break:break-all;user-select:all}

/* ---------- dollhouse ---------- */
#doll{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at 50% 40%,var(--gold-50),var(--gold-200) 70%,#cfc7ad);opacity:0;pointer-events:none;transition:opacity .6s var(--ease-soft)}

const BANK={"en":{"tour_0":"Welcome, and thank you for coming. This is Villa Type A. Three floors, about three hundred and eighty-nine square metres, with parking for two cars. Come in, let me show you around.","tour_1":"Five bedrooms, a men's majlis, a home office, two separate entrances, and rooms for the driver and the maid. Everything a family needs.","tour_2":"Before we go in, right here by the gate, the driver's room, with its own bathroom, completely separate from the house.","tour_3":"Now, back to the main door. After you.","tour_4":"This is the main entrance. Look up: it's double height, two floors tall, and it feels grand from the very first step.","tour_5":"On your left as you come in, the men's majlis. Your guests come straight in here, and never cross the family side.","tour_6":"And if you look outside, its own private garden. A lovely place to sit, isn't it?","tour_7":"Right next to the majlis, guests have their own wash area and toilet.","tour_8":"Back at the entrance, look to your right: a home office. Work, or receive a visitor, without opening up the house.","tour_9":"Straight ahead, the dining room. It sits between the majlis and the family living room, so serving guests is easy.","tour_10":"Come with me. On your right, the family's own entrance, behind this screen. They come and go in complete privacy.","tour_11":"And ahead of you, the family living room. Open, bright, and the heart of the home.","tour_12":"On the other side, the stair. It wraps around a planted courtyard, and brings daylight right into the centre of the house.","tour_13":"Next, the kitchen. It's closed, with worktops all round, built-in ovens, and a window over the sink.","tour_14":"Behind the kitchen, the maid's room, with its own bathroom and the laundry. The driver's room, as we saw, is by the gate.","tour_15":"Now, let's go upstairs. This floor is just for the family. Four master bedrooms, each with its own bathroom.","tour_16":"As you come up, the family lounge. To its righ 3":"Bedroom two is about three and a half by three and a half metres, roughly thirteen square metres.","dim_ff-bath-3":"Bedroom two's bathroom is about two by two and a half metres, roughly six square metres.","dim_ff-bed-1":"Bedroom three is about three and a half by four metres, roughly fourteen square metres.","dim_ff-bath-1":"Bedroom three's bathroom is about two and a half by one and a half metres, roughly four square metres.","dim_ff-bed-2":"Bedroom four is about three and a half by four metres, roughly fourteen square metres.","dim_ff-bath-2":"Bedroom four's bathroom is about two and a half by one and a half metres, roughly four square metres.","dim_sf-stairs":"The roof lobby is about one by three and a half metres, roughly four square metres.","dim_sf-pantry":"The upstairs pantry is about one by two and a half metres, roughly three square metres.","dim_sf-bath":"The guest suite's bathroom is about two by two and a half metres, roughly four square metres.","dim_sf-guest-room":"The guest suite is about three and a half by four metres, roughly fifteen square metres.","area_sched":"Here's the area schedule: the ground floor is about one hundred and ninety square metres, the first about one hundred and fifty-two, the second about forty-seven, a total of about three hundred and eighty-nine, on a three hundred square metre plot.","est_gf-porch":"The parking court has no size written on the plan, but measured from the plan it's about seven and a half by five and a half metres, roughly forty square metres: two cars with room to spare.","est_gf-lobby":"The lobby has no size written on the plan, but measured from the plan it's about two by three metres, roughly six square metres.","est_ff-corridor":"The bedroom corridor has no size written on the plan, but measured from the plan it's about two metres wide and four and a half long.","plot_dims":"A standard plot is roughly twelve metres wide by twenty-five deep, three hundred square metres.","setbacks":"Measured from the plan: the front setback is about six and a half metres, holding the parking and the driver's room, and the side setback about two metres, with the long garden strip. The approved figures are with the Anara team.","no_outkitchen":"There's no outdoor kitchen on the plan, but there's the closed kitchen downstairs, a pantry kitchen on the first floor, and another beside the guest suite.","livings":"There are three living spaces: the living room on the courtyard downstairs, the family hall by the family entrance, and the upstairs lounge with its coffee corner.","orient":"Orientation varies by plot, and the Anara team can tell you each plot's facing. The planted courtyard at the centre brings daylight into the ground floor.","no_basement":"No, there's no basement. The house has three levels: ground, first and second with the roof.","flex":"The spaces are flexible: the upstairs lounge suits the kids' play, the roof works for sitting out and barbecues, and the office or guest suite could become a small gym.","cons":"Honestly: there's no lift, the kitchen is closed rather than open, and the bedrooms are similar in size. Most families prefer this layout for its privacy.","far_guests":"Yes. All the bedrooms are on the first floor, away from the guest side, and guests never pass them.","rooms_areas":"In short: the men's majlis is about twenty square metres, the dining room sixteen square metres, the living room fourteen square metres, the kitchen fourteen square metres, and the office thirteen square metres. On the first floor, the master bedroom is fourteen square metres, the other bedrooms thirteen to fourteen square metres, and the upper lounge twelve square metres. The guest suite upstairs is fifteen square metres. Ask me about any room for its exact size.","best_spot":"My favourite spot is the living room on the planted courtyard. Natural light pours in from the courtyard all day, and you feel outdoors while you're inside. Come, let me show you.","rent":"There's no separate apartment for rent. But the second floor is a private guest suite, with its own bathroom and pantry, perfect for a long-staying guest or a grown-up child.","street":"Street width and frontage vary from plot to plot. The Anara team can give you the details of every available plot. Shall I have them contact you?","units":"The number of villas and available plots is confirmed by the Anara team, since availability changes all the time. Shall I have them contact you?","maint":"Maintenance, service fees and community management are explained in detail by the Anara team. Shall I have them contact you?","dining_cap":"The dining room is about sixteen square metres, comfortably fitting a table for eight to ten people.","brochure":"Of course. Leave your number and email, and the Anara team will send you the full brochure and floor plans.","vague":"Of course. I can give you a quick overview of the villa, the room sizes, show you my favourite spot, or start a full guided tour. What would you like?","light":"Natural light is one of its best features. The planted courtyard in the middle of the house brings sun and air to the ground floor all day, and the upper lounge has its own terrace. Air conditioning and insulation are in the specification sheet, and orientation varies from plot to plot.","guests":"Guests have a whole side of their own. They come in through the main entrance to the men's majlis and its garden, with a guest wash area and bathroom beside it, and the dining room close by. All without passing through the family side. Shall I show you the majlis?","modify":"Changes follow the building regulations and the community guidelines, and the Anara team can tell you what's allowed. The house is also flexible: the office can become a bedroom, and the guest suite can become a gym or a study.","newbuild":"It's a brand-new villa, part of the Anara project currently under development. The sales team will keep you updated on handover dates and construction progress. Shall I have them contact you?","community":"The community's facilities and services, from the walls and gates to the walkways and parks, are explained in detail by the Anara team, along with the project masterplan. Shall I have them contact you?"},"ar":{"tour_0":"هلا والله وحيّاك الله طال عمرك، نوّرت فيلا A. ثلاثة أدوار، ومساحتها تقريباً ثلاثمية وتسعة وثمانين متر، وموقف لسيارتين. تفضّل معي، خلّني أوريك البيت.","tour_1":"خمس غرف نوم، ومجلس رجال، ومكتب، ومدخلين مستقلين، وغرفة للسواق وغرفة للخادمة. يعني كل اللي تحتاجه العايلة.","tour_2":"وقبل ما ندخل، هنا عند البوابة، غرفة السواق بدورة مياهها، مستقلة تماماً عن البيت.","tour_3":"والحين نرجع للباب الرئيسي. تفضّل طال عمرك.","tour_4":"وهذا المدخل الرئيسي. وتشوف طال عمرك المدخل دبل هايت، بارتفاع دورين، يعطيك الفخامة من أول خطوة.","tour_5":"على يسارك وأنت داخل، مجلس الرجال. ضيوفك يدخلون هنا على طول، وما يمرّون على جهة العايلة أبد.","tour_6":"وإذا طالعت برّا، حديقة خاصة قدّام الجلسة. جلسة تفتح النفس، صح؟","tour_7":"وجنب المجلس على طول، مغاسل ودورة مياه خاصة للضيوف.","tour_8":"ونرجع للمدخل. إذا طالعت يمينك، المكتب. تشتغل فيه أو تستقبل زائر، والبيت على راحته.","tour_9":"وقدّامك على طول، غرفة الطعام. بين المجلس وصالة العايلة، يعني الضيافة سهلة ومريحة.","tour_10":"تعال معي طال عمرك. على يمينك مدخل العايلة الخاص، ورا هالساتر. يدخلون ويطلعون براحتهم.","tour_11":"وقدّامك صالة المعيشة. مفتوحة ومنوّرة، وهي قلب البيت.","tour_12":"وعلى الجهة الثانية الدرج، يلتف حول فناء مزروع، ويوصّل النور لوسط البيت.","tour_13":"وبعدها المطبخ. مطبخ مغلق، أسطح عمل من كل جهة، وأفران مدمجة، وشباك فوق المغسلة.","tour_14":"وورا المطبخ غرفة الخادمة، بدورة مياهها وغرفة الغسيل. وغرفة السواق مثل ما شفنا، عند البوابة.","tour_15":"خلّنا نطلع للدور الأول طال عمرك. هذا الدور للعايلة وبس: أربع غرف نوم رئيسية، كل غرفة بدورة مياهها.","tour_16":"أول ما تطلع، صالة العايلة، وعلى يمينها ركن القهوة، وبعده تراس للهوا الطلق.","tour_17":"نبدأ بالغرفة الرئيسية. هادية ووسيعة، وشباكها طويل.","tour_18":"ومن هنا غرفة الملابس، وعلى يسارها دورة مياه خاصة.","tour_19":"وجنبها غرفة النوم الثانية، بدواليبها ودورة مياهها.","tour_20":"تعال من هالممر. إذا طالعت تحت، تشوف المدخل من الفتحة الزجاجية، وهي توصّل النور لجناح غرف النوم.","tour_21":"وإذا طالعت يمينك، غرفة النوم الثالثة. شباكها بساتر، يدخّل النور ويحفظ الخصوصية.","tour_22":"وإذا طالعت يسارك، الرابعة، بدولاب زجاجي وشباك واسع.","tour_23":"وآخر شي، نطلع للدور الثاني طال عمرك. جناح مستقل، بعيد عن كل شي.","tour_24":"غرفة نوم كاملة، وجنبها دورة مياه ومطبخ تحضيري. للضيوف، أو لواحد من العيال، على كيفك.","tour_25":"وإذا طالعت برّا، تراس السطح. تخيّل سهراتكم هنا.","tour_26":"وإذا عجبك اللي شفته طال عمرك، سجّل اهتمامك، ونرتّب لك زيارة خاصة على راحتك. وحيّاك الله.","greet":"هلا والله وحيّاك الله طال عمرك، نوّرت فيلا A! كيف أقدر أخدمك اليوم؟ وش حاب تعرف عن الفيلا؟","greet_salam":"وعليكم السلام ورحمة الله وبركاته، حيّاك الله طال عمرك ونوّرت! كيف أقدر أخدمك اليوم؟","greet_morning":"صباح النور والسرور، حيّاك الله طال عمرك! كيف أقدر أخدمك؟","greet_evening":"مساء النور، حيّاك الله طال عمرك! كيف أقدر أخدمك؟","hey":"هلا والله!","howru":"بخير الحمدلله، الله يسلمك ويعافيك. وأنت كيف حالك طال عمرك؟","greet_howru":"هلا والله وحيّاك الله! بخير الحمدلله، الله يسلمك. وأنت كيف حالك طال عمرك؟","fine":"الحمدلله، دوم يا رب. تبي أبدأ لك الجولة، ولا أوديك لأي غرفة على كيفك؟","okay":"أبشر. وين تحب نروح الحين طال عمرك؟ المجلس، المطبخ، ولا غرف النوم فوق؟","who":"أنا مرشدك في فيلا A في أنارا طال عمرك. أعرف كل زاوية في البيت، فاسألني اللي تبي، بالعربي أو بالإنجليزي.","wow":"الله يطوّل عمرك، يزهاك البيت الطيب المبارك. وعشان تكتمل الصورة، خلّني أوريك المدخل الرئيسي، دبل هايت بارتفاع دورين. نروح له؟","thanks":"العفو طال عمرك، حيّاك الله. تبي أوريك شي ثاني؟","bye":"شكراً على زيارتك طال عمرك، تشرّفت فيك. وإذا تحب تشوفها على الطبيعة، أحجز لك زيارة خاصة على راحتك.","help":"اسألني اللي يهمك طال عمرك: مساحات الغرف، غرف النوم، الأدوار، المواقف، الخصوصية، الموقع، السعر والتسليم. أو قل لي، ودّني المجلس، وأوديك.","unknown":"والله طال عمرك، هالمعلومة ما هي متوفرة عندي تحديداً. وأقدر أخلي أحد من فريق أنارا يتواصل معك، إذا حبيت تسجّل رقمك وإيميلك والوقت المناسب لك. والشباب ما بيقصّرون معك، بيوفرون لك كل البيانات اللي تحتاجها، وأبشر باللي تبيه. تبي أفتح لك التسجيل؟","noProb":"ولا يهمك طال عمرك. وش تحب نسوي الحين؟","come":"أبشر، تفضّل معي.","come2":"أبشر، أفتح لك منصة أنارا.","yesroom":"إيه نعم طال عمرك، موجودة. تفضّل معي أوريك.","opinion":"بصراحة طال عمرك؟ بيت مدروس لعايلة سعودية: الضيوف لهم جهتهم ومجلسهم، والعايلة لها مدخلها وخصوصيتها، وكل غرفة نوم بدورة مياهها. وإذا طالعت حولك، تحس بالنور والراحة. تبي أوريك أحلى زاوية في البيت؟","worth":"القرار لك طال عمرك. اللي يميزها الخصوصية بين الضيوف والعايلة، ودورة مياه لكل غرفة نوم، ودور كامل للعايلة بس. وفريق المبيعات يعطيك الأرقام كاملة وتقارن على راحتك. تبي يتواصلون معك؟","neg":"أفهمك طال عمرك، والصور أحياناً ما تعطي إحساس المكان الحقيقي. ولو تحب الوسع، المجلس وصالة المعيشة من أوسع المساحات. تبي أوديك؟","off":"ههه، سؤال حلو والله! بس أنا تخصصي هالبيت طال عمرك. خلّني أفيدك فيه: تبي نروح المجلس، ولا نطلع لغرف النوم فوق؟","off2":"والله ما عندي فكرة طال عمرك! أنا آخر علمي هالبيت. تبي أوريك أحلى ركن فيه؟","off3":"هذي أكبر مني طال عمرك! أنا شغلتي الغرف والمقاسات. تعال أوريك المجلس، وأضمن لك يعجبك.","off4":"لا والله ما أقدر أجاوب على سؤال زي كذا طال عمرك! بس اسألني عن البيت، وأبشر بالسعد.","off5":"الكورة؟ أخاف أقول رأيي وتزعل علي طال عمرك! خلّنا في البيت أسلم. تبي نشوف صالة المعيشة؟","club":"هههه، سؤال خطير طال عمرك! أنا أشجع اللي يسكن هالبيت. وبعدين المجلس يكفي الجماهير كلها، هلالية ونصراوية، والقهوة على حسابي!","oneword":"ناقصه إنت… والبيت تراه يجمّلك.","disc":"ودّي والله طال عمرك! بس الأسعار والعروض عند فريق المبيعات، وأنا أوصّل لهم طلبك. تبي يتواصلون معك؟","sorry":"سامحني طال عمرك إذا ما فهمتك صح. جرّب تسألني بطريقة ثانية، أو قل لي وش تبي تشوف.","next":"تعال معي طال عمرك، خلّني أوريك اللي بعده.","sure":"إيه أكيد طال عمرك، هالأرقام من مخططات أنارا المعتمدة.","lives":"لسا محد طال عمرك. البيت ينتظر أهله، ويمكن تكونون أنتم.","brief":"حيّاك الله طال عمرك. الفيلا ثلاثة أدوار، ومساحتها حوالي ثلاثمية وتسعة وثمانين متر. فيها خمس غرف نوم، كل غرفة بدورة مياهها، وتسع دورات مياه بالكامل. الأرضي للضيافة والعايلة: مجلس رجال بحديقته، ومكتب عند المدخل، وغرفة طعام، وصالة معيشة على فناء مزروع، ومطبخ مغلق. والأول للعايلة وبس: أربع غرف نوم رئيسية، وصالة، وتراس. وفوق جناح ضيوف يطل على السطح. وأحلى ما فيها؟ إن الضيف ما يمر على جهة العايلة أبد. نبدأ من المجلس؟","near":"سؤال مهم طال عمرك. المشروع في الرياض، على بعد حوالي خمسة وعشرين دقيقة من مطار الملك خالد، وخريطة منصة أنارا توريك المدارس والمساجد والخدمات اللي حوله. تبي أفتحها لك؟","measureGo":"أبشر، المسطرة جاهزة. المس نقطة البداية على الأرض، وبعدها نقطة النهاية للمكان اللي تحب تقيسه. ولو تبي الارتفاع، المس الأرض وبعدها اطلع لفوق.","nosize":"طال عمرك، هالمكان ما له مقاس محدد في المخطط. بس تقدر تقيسه بنفسك بالمسطرة، تبي أفتحها لك؟","height":"ارتفاع السقف ما هو مكتوب في المخطط طال عمرك، بس تقدر تقيسه بنفسك: المس الأرض عند الجدار، وبعدها اطلع لفوق عند السقف. تبي أفتح لك المسطرة؟","beds":"خمس غرف نوم طال عمرك. أربع غرف رئيسية في الدور الأول، كل غرفة بدورة مياهها، وجناح ضيوف مستقل في الدور الثاني.","baths":"تسع دورات مياه بالكامل. كل غرفة نوم لها دورة مياهها، وللضيوف مغاسل ودورة مياه مستقلة، وللخادمة والسواق كل واحد دورة مياهه.","floors":"ثلاثة أدوار طال عمرك. الأرضي للضيافة والعايلة، والأول للعايلة وبس فيه أربع غرف نوم رئيسية، والثاني جناح ضيوف مع السطح.","area":"المساحة حوالي ثلاثمية وتسعة وثمانين متر مربع: تقريباً مية وتسعين في الأرضي، ومية واثنين وخمسين في الأول، وسبعة وأربعين في الثاني.","fl0":"الدور الأرضي فيه مدخل الفيلا، ومجلس الرجال بحديقته، والمكتب، وغرفة الطعام، وصالة المعيشة على الفناء المزروع، والمطبخ المغلق وغرفة الغسيل، وغرفة الخادمة وغرفة السواق.","fl1":"الدور الأول للعايلة وبس طال عمرك: أربع غرف نوم رئيسية بدورات مياهها، وغرفة ملابس، وصالة العايلة مع ركن القهوة، ومطبخ تحضيري، وتراس.","fl2":"الدور الثاني جناح ضيوف مستقل، بدورة مياهه ومطبخه التحضيري، ويطل على تراس السطح.","largest":"أوسع غرفة طال عمرك مجلس الرجال، تقريباً عشرين متر مربع. تعال أوريك.","smallest":"أصغر مساحة مغسلة العايلة، أقل من مترين مربع.","price":"الأسعار وخطط الدفع عند فريق مبيعات أنارا طال عمرك، عشان تكون محدّثة دايماً. تبي أخليهم يتواصلون معك بأحدث العروض؟","avail":"التوفّر لكل فيلا موجود على المخطط العام في منصة أنارا طال عمرك، وتشوف المتاح والمحجوز والمباع.","handover":"مواعيد التسليم وسير البناء يأكدها فريق مبيعات أنارا طال عمرك. سجّل بياناتك ويطلعونك على كل جديد.","visit":"أبشر بسعدك طال عمرك. سجّل اسمك ورقمك، وفريق أنارا يرتّب لك زيارة خاصة.","loc":"أنارا من سمو في الرياض طال عمرك، على بعد حوالي خمسة وعشرين دقيقة بالسيارة من مطار الملك خالد الدولي، ومنصة أنارا توريك الموقع كامل وأوقات الوصول.","dev":"أنارا من تطوير شركة سمو طال عمرك.","hl":"اللي يميزها طال عمرك: مدخل رئيسي ومدخل عايلة مستقلين، ومدخل دبل هايت بارتفاع دورين، ومكتب عند الباب، ومطبخ بجهة خدمة خاصة، ودورة مياه لكل غرفة نوم، وجناح ضيوف مع السطح.","park":"موقف لسيارتين طال عمرك، على يمين المدخل الرئيسي.","privacy":"الخصوصية أساس التصميم طال عمرك. الضيوف يدخلون من المدخل الرئيسي للمجلس بدون ما يمرّون على جهة العايلة، والعايلة لها مدخلها الخاص، والدور الأول كله لها.","outdoor":"ثلاث مساحات خارجية طال عمرك: الفناء المزروع في وسط الدور الأرضي، وتراس صالة العايلة فوق، وتراس السطح جنب جناح الضيوف.","pool":"المسبح ما هو ضمن مخططات الفيلا طال عمرك. والمساحات الخارجية: الفناء المزروع، وتراس الدور الأول، وتراس السطح.","lift":"المخططات ما فيها مصعد طال عمرك. الدرج يلتف حول الفناء المزروع ويربط الأدوار الثلاثة، وفريق المبيعات يفيدك بأي خيارات.","staff":"إيه نعم طال عمرك. غرفة الخادمة بدورة مياهها وغرفة الغسيل ورا المطبخ، وغرفة السواق بدورة مياهها عند البوابة، مستقلة تماماً عن البيت.","family":"مناسبة جداً للعايلة الكبيرة طال عمرك: خمس غرف نوم بدورات مياهها، ودور كامل للعايلة، وصالتين، وغرف مستقلة للخادمة والسواق.","spec":"التشطيبات والتكييف والمنزل الذكي والضمانات كلها في جدول مواصفات أنارا طال عمرك. تبي أخلي فريق المبيعات يرسله لك؟","furn":"الأثاث في الجولة يوضّح لك كيف ممكن تعيش في البيت طال عمرك، وفريق المبيعات يأكد لك وش يشمل العرض بالضبط.","custom":"أي تعديلات على التصميم أو التشطيبات تتناقش مع فريق مبيعات أنارا طال عمرك. تبي يتواصلون معك؟","other":"أنارا فيها ثلاثة نماذج طال عمرك: هذا النموذج A، والنموذج D، والنموذج C دوبلكس. و ي حوالي خمسطعش متر مربع.","area_sched":"هذا جدول المساحات طال عمرك: الأرضي حوالي مية وتسعين متر مربع، والأول حوالي مية واثنين وخمسين، والثاني حوالي سبعة وأربعين، والمجموع حوالي ثلاثمية وتسعة وثمانين متر مربع، على قطعة ثلاثمية متر.","est_gf-porch":"ساحة الموقف ما لها مقاس مكتوب طال عمرك، بس بالحساب من المخطط تقريباً سبعة ونص في خمسة ونص، يعني حوالي أربعين متر مربع، تكفي سيارتين براحة.","est_gf-lobby":"البهو ما له مقاس مكتوب طال عمرك، بس بالحساب من المخطط تقريباً مترين في ثلاثة، يعني حوالي ستة متر مربع.","est_ff-corridor":"ممر الغرف ما له مقاس مكتوب طال عمرك، بس بالحساب من المخطط عرضه حوالي مترين، وطوله حوالي أربعة ونص.","plot_dims":"القطعة العادية تقريباً اطنعش متر عرض في خمسة وعشرين طول طال عمرك، يعني ثلاثمية متر مربع.","setbacks":"بالحساب من المخطط طال عمرك: الارتداد الأمامي حوالي ستة متر ونص، وفيه الموقف وغرفة السواق، والارتداد الجانبي حوالي مترين، وفيه الحديقة الطولية. والتفاصيل المعتمدة عند فريق أنارا.","no_outkitchen":"ما فيه مطبخ خارجي في المخطط طال عمرك، بس فيه المطبخ المغلق تحت، ومطبخ تحضيري في الدور الأول، ومطبخ تحضيري ثاني جنب جناح الضيوف.","livings":"فيه ثلاث صالات طال عمرك: صالة المعيشة على الفناء في الأرضي، وصالة العايلة جنب مدخلها، وصالة علوية في الدور الأول مع ركن القهوة.","orient":"الاتجاه يختلف من قطعة لقطعة طال عمرك، وفريق أنارا يحدد لك اتجاه كل قطعة. وفي وسط البيت فناء مزروع يدخّل النور الطبيعي للأرضي.","no_basement":"لا طال عمرك، ما فيه قبو. البيت ثلاثة أدوار: أرضي وأول وثاني مع السطح.","flex":"المساحات مرنة طال عمرك: صالة العايلة العلوية تصلح للعب العيال، والسطح للجلسات والشواء، والمكتب أو جناح الضيوف ممكن يصير نادي رياضي صغير.","cons":"بكل صراحة طال عمرك: ما فيه مصعد، والمطبخ مغلق مو مفتوح، وغرف النوم أحجامها متقاربة. وهذا التصميم أغلب العوايل تفضّله عشان الخصوصية.","far_guests":"إيه طال عمرك، غرف النوم كلها في الدور الأول بعيد عن جهة الضيوف، والضيف ما يمر عليها أبد.","rooms_areas":"على السريع طال عمرك: مجلس الرجال حوالي عشرين متر مربع، وغرفة الطعام ستطعش متر، وصالة المعيشة أربعطعش متر، والمطبخ أربعطعش متر، والمكتب ثلطعش متر. وفي الدور الأول: الغرفة الرئيسية أربعطعش متر، وباقي غرف النوم بين ثلطعش وأربعطعش متر، والصالة العلوية اطنعش متر. وجناح الضيوف فوق خمسطعش متر. وأي غرفة تبي مقاسها بالضبط، اسألني عنها.","best_spot":"أحلى ركن عندي طال عمرك صالة المعيشة على الفناء المزروع. النور الطبيعي يدخل من الفناء طول اليوم، وتحس إنك برا وأنت جوا. تعال أوريك.","rent":"ما فيه شقة مستقلة للتأجير طال عمرك. بس الدور الثاني جناح ضيوف مستقل، بدورة مياهه ومطبخه التحضيري، ويصلح لضيف يطوّل أو لأحد من العيال الكبار.","street":"عرض الشارع والواجهة يختلفون من قطعة لقطعة طال عمرك، وفريق أنارا يعطيك تفاصيل كل قطعة متاحة. تبي أخليهم يتواصلون معك؟","units":"عدد الفلل والقطع المتاحة يأكدها لك فريق أنارا طال عمرك، لأن التوفر يتغير أول بأول. تبي أخليهم يتواصلون معك؟","maint":"الصيانة ورسوم الخدمات وإدارة المجمّع يوضحها لك فريق أنارا بالتفصيل طال عمرك. تبي أخليهم يتواصلون معك؟","dining_cap":"غرفة الطعام حوالي ستطعش متر مربع طال عمرك، تكفي طاولة لثمانية إلى عشرة أشخاص براحة.","brochure":"أبشر طال عمرك. سجّل رقمك وإيميلك، وفريق أنارا يرسل لك البروشور والمخططات كاملة.","vague":"أبشر طال عمرك. أقدر أعطيك نبذة سريعة عن الفيلا، أو مساحات الغرف، أو أوريك أحلى ركن فيها، أو أبدأ لك جولة كاملة. وش تحب؟","light":"النور الطبيعي من أحلى ما فيها طال عمرك. الفناء المزروع في وسط البيت يدخّل الشمس والهوا للأرضي طول اليوم، والصالة العلوية لها تراسها. والتكييف والعزل تفاصيلها في جدول المواصفات، والاتجاه يختلف من قطعة لقطعة.","guests":"للضيوف جهة كاملة لهم طال عمرك: يدخلون من المدخل الرئيسي على مجلس الرجال بحديقته، وجنبه مغاسل ودورة مياه للضيوف، وغرفة الطعام قريبة. وكل هذا بدون ما يمرّون على جهة العايلة. تبي أوريك المجلس؟","modify":"التعديلات تمشي حسب أنظمة البناء واشتراطات المجمّع طال عمرك، وفريق أنارا يفيدك وش المسموح. والبيت فيه مرونة: المكتب يتحوّل غرفة نوم، وجناح الضيوف يصير نادي رياضي أو مكتب.","newbuild":"الفيلا جديدة طال عمرك، من مشروع أنارا اللي تحت التطوير. ومواعيد التسليم وسير البناء يأكدها لك فريق المبيعات أول بأول. تبي أخليهم يتواصلون معك؟","community":"مرافق المجمّع وخدماته، من الأسوار والبوابات إلى الممشى والحدائق، يوضحها لك فريق أنارا بالتفصيل طال عمرك، مع المخطط العام للمشروع. تبي أخليهم يتواصلون معك؟"}};
